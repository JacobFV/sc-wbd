# StudyForrest retinotopic mapping and object categories (3 T localizer session).
# Dataset card: scwbd/sources/cards/ds000113.yaml
#
# LICENCE: UNRESOLVED. Snapshot 1.3.0 ships no LICENSE file, no `License` key in
# dataset_description.json and no licence sentence in its 23,818-byte README.
# The dataset card records UNKNOWN, which does NOT resolve to permissive.
#
# THIS IS A HARD BLOCKER ON ENABLING THIS CARD, separately from N-4a. An
# artifact cannot inherit a term nobody can state. Verified through the release
# module's own union: adding this source moves the checkpoint's `noncommercial`
# from False to None -- unknown, not permissive, which is the correct direction
# and is also disqualifying for any checkpoint whose licence must be provable.
#
# TO ENABLE: resolve the licence upstream (the studyforrest project is
# documented elsewhere as PDDL, but that statement is not in the bytes we hold
# and studyforrest.org did not resolve from this host on 2026-08-06), AND land
# the parcellation N-4a describes.
# SECOND BLOCKER, added 2026-08-06 after 🧠 Cajal's D9 slab finding. The EPI is
# a 116 mm slab, not a head, and whether it contains each subject's whole
# brain is UNKNOWN (no segmentation tool is installed to settle it). Parcels
# outside the slab have no measurement in any subject, systematically, by
# acquisition. Enabling this card before a declared per-parcel coverage mask
# exists would contribute a likelihood term for regions with no observation
# operator at all -- an imputation, and rule 1 forbids it.
#
# This is enforced, not just written here: `spatial.coverage.whole_brain` is
# `unknown` on the dataset card and is named in the `requires` of every
# BOLD-facing gradient target, so Appendix B disables those paths by itself.
# Setting `enabled: true` on this file is NOT sufficient to train `bold.*`.

id: ds000113_real
role: likelihood
enabled: false
is_simulated: false
losses: [likelihood, forecast]

gradient_permission:
  - "bold.*"
  - "local.*"
  - "readout.*"
frozen:
  - "eeg.*"
  - "coupling.*"      # a retinotopy localizer constrains local visual dynamics,
                      # not whole-brain coupling
  - "individualizer.*"

# Regenerated from disk (`python -m scwbd.sources.inventory ds000113`), by
# reading the NIfTI headers of all 20 functional runs on disk:
#   sub-01  retmap{ccw,clw,con,exp} x1 each (90 vol = 180 s), movielocalizer
#   sub-02  retmap{ccw,clw,con,exp} x2 each,                  movielocalizer
#   sub-03  retmap{ccw,clw,con,exp} x1 each,                  movielocalizer
#   sub-04  movielocalizer ONLY -- no retinotopy
# n_eff is the number of participants that can contribute to the objective this
# card exists for, which is retinotopy: THREE, not four. Counting sub-04 here
# would inflate the effective sample size with a participant who has none of
# the measurement.
n_eff: 3.0
n_rows: 20.0
n_participants: 4
n_sites: 1
hierarchy_depth: 2

measurement_variance: null
bias_halfwidth: null
bias_status: unknown
model_discrepancy: null
validity_overlap: 1.0
leakage_audited: false

compiler_permission:
  - "port:*.bold_out"
  - "observation:ds000113_real:nuisance"

notes: >-
  Retinotopic mapping (four traversals: ccw, clw, expanding, contracting) plus
  object categories and a movie localizer. Serves the unimodal-cortex family --
  the one §6.1 family that the 414-parcel anatomy prior can represent and that
  had no corpus at all. Holding out `clw` and predicting it from `ccw`
  separates a model that learned retinotopic structure from one that learned a
  stimulus template.
