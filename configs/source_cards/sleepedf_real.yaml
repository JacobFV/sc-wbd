# Sleep-EDF Expanded. MEASURED human data, 2 EEG derivations only.
# Disabled by default: with 2 bipolar channels it cannot constrain the 64-channel
# observation head, and enabling it without a separate montage adapter would be
# exactly the forced consensus Appendix D warns against.
id: sleepedf_real
role: likelihood
enabled: false
is_simulated: false
losses: [likelihood, forecast]
gradient_permission: ["local.*", "residual.*", "assimilate.*", "readout.*"]
frozen: ["eeg.*", "bold.*", "coupling.*"]
n_eff: 78.0
n_rows: 197.0
n_participants: 78
hierarchy_depth: 3
measurement_variance: 0.5
bias_halfwidth: 0.4
bias_status: prior_specified_sensitivity
validity_overlap: 0.5
notes: >
  Two bipolar derivations (Fpz-Cz, Pz-Oz) at 100 Hz during sleep. Different state,
  different montage, different reference. Needs a source-specific adapter before it
  may update any shared operator.
compiler_permission:
  - "operator:local_field:params"
  - "operator:assimilation:*"
  - "region:*:state:*"
