# PhysioNet EEG Motor Movement/Imagery Database (109 participants, 64ch, 160 Hz).
# MEASURED human data under the ODC-BY / PhysioNet open licence. This is one of
# only two sources in the mixture that can support a claim about real brains.
id: eegmmidb_real
role: likelihood
is_simulated: false
losses: [likelihood, forecast, calibration, posterior]
gradient_permission:
  # The family-padded arm prefixes the regional modules (`family_local`,
  # `family_residual`, `family_readout`); the pooled arm does not. Both
  # namings are granted because both arms are live, and a glob that matches
  # nothing is an EMPTY permission set rather than an error -- which is how
  # run 2 trained 11.3% of its parameters and shipped. See RUN2.md §4.
  - "local.*"
  - "family_local.*"
  - "residual.*"
  - "family_residual.*"
  - "coupling.*"
  - "msg_proj.*"
  - "msg_readin.*"
  - "assimilate.*"
  - "context.*"
  - "readout.*"
  - "family_readout.*"
  # `observation.*` -- the per-family projection into observation space --
  # was reachable by NO card in run 2 and sat at its initialisation for the
  # whole run while on the forward path. Granted here to the sources whose
  # likelihood it serves. This is a modelling decision made deliberately
  # rather than a test being made green: leaving it unreachable now would
  # repeat a defect already measured. `behaviour.*` is NOT granted -- no
  # source declares a boundary_output channel yet, so nothing has evidence
  # about it, and that absence is the honest state.
  - "observation.*"
  - "eeg.*"
  - "log_dt_scale"
  - "individualizer.*"
frozen:
  - "bold.*"   # no haemodynamics were measured; an EEG corpus may not train BOLD
n_eff: 109.0            # participants, the actual unit of independence
n_rows: 1526.0          # runs; recorded for audit only
n_participants: 109
n_sites: 1
hierarchy_depth: 3      # participant < run < window
measurement_variance: 0.35
bias_halfwidth: 0.20    # montage/reference/amplifier systematic offset
bias_status: prior_specified_sensitivity
model_discrepancy: 0.0
validity_overlap: 1.0
notes: >
  Scalp EEG during rest, real and imagined movement. Single site, single montage,
  no individual head models: supports population-level EEG prediction claims only.
compiler_permission:
  - "operator:local_field:*"
  - "operator:long_range:*"
  - "operator:assimilation:*"
  - "region:*:state:*"
  - "port:*.message_out"
  - "port:*.message_in"
  - "port:*.eeg_out"
  - "observation:eegmmidb_real:nuisance"
