# SC-WBD-001-beta -- the released configuration.
# This file is copied verbatim into checkpoints/scwbd-001-beta/config.yaml
# together with the git SHA. If they disagree, the checkpoint is not the artifact.

# Refusal R12: one operator for all regions (`model.local_core`, a single
# string) and no declared cross-scale prolongation. Structurally the
# equal-capacity generic control of body.tex sec. 11.4, exactly as
# configs/scwbd_001_beta.yaml is -- this file differs from it only in run name
# and output paths. Declared so it stays runnable under a control designation
# rather than the model's. See reports/scope_gap.md.
arm:
  role: control
  controls_for: "11.4:structured_regional_state"
  justification: >
    One learned operator for all regions and a single-scale poset with no
    prolongation: the equal-capacity generic control against which structured
    heterogeneous regional state (body.tex 2.1) and non-nested source-native
    resolutions (4.2) must be measured. Used as the population-level reference
    arm for the G5 individualization comparison.

model:
  # 454 = the SYNTHETIC prior's region count, not a real parcellation.
  #
  # This previously read "Schaefer-400 cortex + 32 subcortex + 22 cerebellum",
  # which described an intent the code did not execute. The anatomy adapter
  # (anatomy.py:_from_agent_c) reads obj.weights where the real BrainPrior
  # exposes obj.structural.weights; the AttributeError is swallowed by a bare
  # `except Exception` at anatomy.py:293 and _synthetic_prior is substituted.
  # The real prior is 414 parcels (verified: BrainPrior.labels.shape), so 454
  # was itself the tell that the
  # fallback was in force -- and the comment asserting a parcellation the model
  # never loaded is a false provenance assertion.
  #
  # See reports/training/anatomy_provenance.md. Fix belongs in the next run.
  n_regions: 454
  local_core: learned         # "learned" | wilson_cowan | jansen_rit | wong_wang | ...
  hidden: 288
  n_local_layers: 3
  region_embed: 96
  context_dim: 128
  message_dim: 12
  n_delay_bins: 8
  n_spectral_modes: 8
  n_adaptation: 2
  n_uncertainty: 4
  dt_model: 0.008             # 125 Hz fast (neural) clock
  hemo_ratio: 25              # 200 ms slow (haemodynamic) clock
  residual_rho_max: 0.35      # R05 guard
  residual_init_scale: 0.05
  encoder_channels: 96
  encoder_layers: 3
  dropout: 0.0
  control_graph: none
  scalar_state_ablation: false
  dense_coupling_ablation: false
  n_eeg_channels: 64
  n_behaviour: 4
  use_bf16: true
  compile: true

posterior:
  summary_channels: 128
  summary_layers: 4
  flow_layers: 8
  flow_hidden: 320
  n_bands: 7
  n_pcs: 16
  dropout: 0.0
  nuisance_dim: 2             # EEG gain + sensor-noise nuisance

data:
  sim_index_fast: /data/scwbd/sim_corpus/index_fast.json
  sim_index_slow: /data/scwbd/sim_corpus/index_slow.json
  real_eeg_root: /data/scwbd/eegmmidb/1.0.0
  real_sleep_root: /data/scwbd/sleep-edfx/1.0.0
  window: 48                  # model steps forecast (0.384 s)
  context: 24                 # assimilation window (0.192 s)
  fs_hz: 125.0
  # 64. Measured, after two failures (2026-08-06):
  #   batch 192 -> hit the 40 GB device cap mid-step
  #   batch 128 -> 35.27 GB reserved at step 1, hit the cap shortly after
  # The working set is largely batch-INDEPENDENT (the 33% cut from 192 barely
  # moved it), so the 0.203 GB/sample linear model I first assumed was wrong.
  # 64 is the next honest bisection, not a derived number.
  batch: 64
  # 4, not 10: each persistent worker holds its own copy of the batch plus its
  # HDF5 read buffers in the single 121 GB unified pool the GPU allocates from.
  # Ten of them plus pinning is what put this run in the 2026-08-05 OOM.
  num_workers: 4
  pin_memory: false
  val_fraction: 0.05
  real_test_fraction: 0.25
  seed: 20260805

train:
  run_name: scwbd-001-beta-g5control
  out_dir: checkpoints/scwbd-001-beta-g5control
  report_dir: reports/training/g5control
  seed: 20260805
  device: cuda
  # TRUE because this run was ALREADY trained on the synthetic prior -- the
  # adapter defect was found at Stage III and the fix ships for the next run.
  # This changes no behaviour; it makes the fallback a declaration instead of an
  # accident, and keeps this run resumable now that a silent fallback raises.
  # The next run sets this false and rebuilds the corpus at 414 parcels.
  anatomy_force_fallback: true
  amp_dtype: bfloat16
  # Device-side ceiling on the CUDA caching allocator. NOT redundant with
  # `systemd-run -p MemoryMax=40G`: on this unified-memory box the cgroup does
  # not charge device allocations, so MemoryMax reported 8.17 GB while this run
  # held 97.9 GB and took the machine to 8 GB free. See
  # reports/training/platform_memory_limits.md.
  cuda_reserve_gb: 40.0
  # 12 h. Measured 4.3-4.7 s/step at batch 64 on a quiet machine, so the
  # designed 8,700-step curriculum needs ~10.5-11.3 h. At the old 5 h cap the
  # run stopped around step 3,860: Stages I-III only, with Stage IV assembly
  # and Stage V individualization never executing. A checkpoint without Stage V
  # cannot be tested against G5 at all, so the shorter run is not a cheaper
  # version of this artifact -- it is a different one.
  max_wall_seconds: 43200     # 12 h
  resume: true
  # Learning rates sqrt-scaled by sqrt(64/192) = 0.5774 on 2026-08-06.
  # The original rates (6.0e-4 ... 1.0e-4) were written for batch 192; batch was
  # cut to 64 for device memory without revisiting them, which is 3x noisier
  # gradients at unchanged step size. grad_clip=1.0 prevented blow-up but that
  # is not the failure that mattered: unit-norm steps in noisier directions
  # degrade converged quality quietly. The within-run tell was the loss floor
  # RISING as lr crossed ~5e-4 (0.33 at 2-4e-4 -> 0.60 at 6e-4); floors should
  # fall as training proceeds. Caught at step ~200 and restarted.
  stages:
    - name: I_regional
      steps: 900
      lr: 3.46e-4
      lambda_obs: 0.0
      lambda_posterior: 0.0
      lambda_anat: 0.0
      ckpt_every: 150
    - name: II_interface
      steps: 700
      lr: 2.31e-4
      lambda_posterior: 0.0
      lambda_port: 0.05
      ckpt_every: 150
    - name: III_sliced
      steps: 2600
      lr: 1.73e-4
      ckpt_every: 250
    - name: IV_assembly
      steps: 3600
      lr: 1.15e-4
      lambda_perturb: 0.0
      ckpt_every: 250
    - name: V_individual
      steps: 900
      lr: 5.77e-5
      lambda_posterior: 0.3
      ckpt_every: 150

mixture_cards: configs/source_cards
notes: >
  Population/general adult model. Not a validated twin of any person. Simulated
  sources carry the 'prior' role and can never establish biological validity.
