# Smoke override for configs/run3/scwbd-003.yaml.
#
# A DISTINCT `train.run_name`, not just a distinct `--out`. `--out` moves the
# checkpoints; the JSONL log is keyed by run_name, so a smoke run sharing the
# name would append to the production log and the two would be indistinguishable
# afterwards.
base: scwbd-003.yaml
train:
  run_name: scwbd-003-smoke
  out_dir: checkpoints/scwbd-003-smoke
  resume: false
  max_wall_seconds: 3600
  # Added 2026-08-10, retroactively. `--quick` shrinks the participant rosters
  # and does NOT touch step counts, so this smoke ran T1's full step count until
  # `max_wall_seconds` stopped it and never reached the later stages -- it
  # exercised the first stage's loss paths and nothing else. Affects nothing run
  # 3 published: this is the smoke config, not `scwbd-003.yaml`, and no number in
  # any report came from it.
  max_steps_per_stage: 4
  # Same redirect as run 4's, and for the same reason: `run_stage` also writes a
  # legacy FLAT `report_dir/mixture_<stage>.json` that any run with matching
  # stage names overwrites. Added 2026-08-10 after run 4's smoke destroyed five
  # of run 3's flat mixture reports (restored from git).
  report_dir: reports/training/smoke-003
data:
  batch: 8
