# SC-WBD-004 -- a haemodynamic fMRI likelihood, and a person effect that is fitted.
#
# Derived from configs/run3/scwbd-003.yaml. Inherited rather than copied: the
# architecture, the four observation montages and the data roots are the same
# objects, and a copy would let them drift apart silently. What 004 changes is
# listed here and nowhere else.
#
#   1. The measured BOLD path integrates the Balloon-Windkessel ODE across the
#      duration a BOLD frame actually covers (ISSUE-008 fix (c)). This is the
#      cost driver and it is measured below.
#   2. A person/session effect is FITTED, in a sixth stage, on the only corpus
#      with two sessions per participant.
#
# ---------------------------------------------------------------------------
# COST: MEASURED ON THIS BOX, NOT ESTIMATED
# ---------------------------------------------------------------------------
# `scripts/measure_run4_cost.py`, 23 optimiser steps of the T1 loss set with the
# first 3 discarded, on the 414-parcel prior at hidden=1408, all seven measured
# sources contributing a term. Raw output in reports/run4_cost/, discussion in
# reports/RUN4.md.
#
#   frames  bold_every   s/step   peak reserved   peak allocated
#        2           1      ---   OUT OF MEMORY at step 1, 56 GB cap
#        1           1     9.45          52.54 GB       50.50 GB
#        1           1     9.30          52.54 GB       50.50 GB   (repeat)
#        1        1000     7.22          35.55 GB       34.18 GB   (BOLD off)
#
# Read three ways:
#
#   * **2 frames does not fit.** 500 neural steps of the Balloon ODE, held live
#     beside seven other sources' graphs -- `MixtureTrainer` backwards each with
#     `retain_graph=True` -- exceeded the 56 GB cap on the FIRST step. The cap
#     held and the box survived; run 3's peak was 46.13 GB.
#   * **The measured BOLD term costs 2.08 s/step and 17.0 GB of reserve** at one
#     frame. That is the difference between the two arms above, and it is the
#     whole increment over run 3's path, which rolled 8 neural steps.
#   * **9.30 s/step against run 3's ~8.06.** 14,600 steps is ~38 h, which is why
#     `max_wall_seconds` moved.
#
# Not measured, and stated rather than assumed: T4 admits the simulator as well
# and is not this loss set, so the whole-run figure above is T1's rate applied to
# every stage. It is a planning number, not a measurement of the run.
#
# One foreign pytest was running in another repository during the timed steps.
# The harness records it (`contention` in each JSON) and it is why the step time
# is quoted as an upper bound. Peak reserve is per-process and unaffected; the
# two BOLD-on arms agree to the byte on memory and to 0.15 s on time.
#
# ---------------------------------------------------------------------------
# INDIVIDUALISATION: WHAT MAKES IT MEASURABLE HERE AND NOT IN 003
# ---------------------------------------------------------------------------
# 003 recorded `individualization: {"applied": false, "reason": "no
# individualizer on the trainer (population model)"}` after a completed 13,400-
# step run. The class existed, the checkpoint slot existed, and no stage ever
# constructed one -- `individualize` is a property of a stage's curriculum block
# and no 003 stage declared it.
#
# `T6_individual` below declares it. Three things had to be true at once and
# each was false in 003:
#
#   * the participant index spans every EEG corpus, not just eegmmidb. It read
#     `real_dataset` alone, so all 78 sleep-edfx participants fell onto row 0
#     and shared one person effect.
#   * `sleepedf_real` GRANTS `individualizer.*`. It froze it through 003, which
#     put the permission on the corpus with one session per person and withheld
#     it from the corpus with two.
#   * the individualizer's parameters are in `moved_since_init`. They were in
#     neither of that function's two module lists, so a fitted person effect and
#     an absent one produced the same report.
#
# The stage freezes the population dynamics and fits the effect plus the
# observation nuisance. `eeg_montages.*` is granted beside `eeg.*` because
# sleep-edfx is observed through its own 2-row bipolar operator.

# ---------------------------------------------------------------------------
# `msg_proj.*` IS GONE FROM EVERY STAGE, AND THAT IS NOT A TIDY-UP
# ---------------------------------------------------------------------------
# Run 3 granted it in all five stages and reported it frozen for 13,400 steps
# with no explanation. The explanation is that `SCWBD.msg_proj` is the POOLED
# arm's message projection and is now built only when `family_state` is false;
# this run is the family arm, where both call sites read
# `family_local.ports.message(...)`. The port projections it grants are already
# inside `family_local.*`.
#
# The same drift had reached the compiler: `FOUNDATION_FAMILY_BINDING` still
# bound `port:*.message_out` to `msg_proj.*`, so `audit_binding` reported eight
# decorative permissions and `FoundationTrainer.__init__` refused to construct.
# Found by building a run-4 trainer, not by a test -- every assertion in
# `test_compiler_binding.py` runs on the pooled arm.

base: ../run3/scwbd-003.yaml

# ---------------------------------------------------------------------------
# THE POSTERIOR BLOCK IS RESTATED HERE, NOT INHERITED (ISSUE-012)
# ---------------------------------------------------------------------------
# Run 3's posterior returned the prior: `posterior_r2` <= 0.001 on all six
# parameters, while an MLP on the very conditioning vector the flow is handed
# reaches 0.753 on `log_G`. Three of the four causes were config, and run 3's
# block is `base:` above.
#
# The trap this block exists to close: `nuisance_dim`'s DEFAULT was moved to 0
# when ISSUE-012 was written, and run 3 sets it to **2** at line 144 of the file
# this one inherits. A default cannot fix a config that overrides it. That is
# ISSUE-012's own finding about run 2 -- "a fix that lives in one pilot config
# and not in the default is not a fix" -- read in the other direction, and it
# would have reached T4 with the defect intact. It would not have run silently:
# `AmortizedPosterior.loss` raises ConstantTargetDimension on a target column
# that never varies, so the run would have DIED about 5,400 steps and ~14 h in.
# The guard works. Paying 14 h to fire it is still a waste.
posterior:
  summary_channels: 128
  summary_layers: 4
  flow_layers: 6
  flow_hidden: 256
  n_bands: 7
  n_pcs: 16

  # (a) No point-mass coordinates. The trainer passes `torch.zeros(B, n)` for
  #     nuisance and has never estimated it, so at 2 the flow was asked to put
  #     finite density on a constant -- an unbounded reward that costs nothing.
  #     Measured on run 3's checkpoint: those two coordinates took 12.99 of the
  #     15.9 nats by which `npe_loss` fell, and the theta term finished 0.09
  #     nats BELOW the prior's own entropy.
  nuisance_dim: 0

  # (c) Standardise the conditioning per dimension ACROSS DATASETS. Run 3's
  #     LayerNorm normalised across the 128 features of ONE SAMPLE, which keeps
  #     the pattern every dataset shares and shrinks the part that tells them
  #     apart: measured, the between-dataset variation ended at 5.5% of the
  #     within-vector spread, and shuffling `c` across the batch moved `-log q`
  #     by 0.001-0.003 nats. The flow was not ignoring its conditioning so much
  #     as being handed the same vector every time.
  cond_norm: dataset_std_v2

  # (b) The posterior LR. MEASURED, not inherited. 0.02 x T4's 2.0e-4 is 4.0e-6,
  #     and that rate was chosen to stop a DIVERGENCE whose two other causes --
  #     the point mass and the conditioning -- are fixed above.
  #
  #     Chosen by the rule pre-registered in reports/RUN4_LAUNCH_PLAN.md §3,
  #     written before the data was seen: held-out `-log q` must not exceed the
  #     4.0e-6 control's (the control returns the prior, so its density is the
  #     honest-width baseline; a cell that recovers the mean while paying MORE
  #     than that is overconfident), and among cells passing, maximise log_G R^2.
  #
  #     1500 steps/cell, held-out trajectories spanning shards:
  #
  #       cond_norm         lr       log_G R^2   -log q    passes?
  #       layer_v1        4.0e-6      -0.001      7.866    control
  #       layer_v1        1.0e-3      +0.644      8.445    no  (overconfident)
  #       layer_v1        3.0e-3      +0.665      8.549    no  (overconfident)
  #       dataset_std_v2  4.0e-6      +0.020      7.932    control
  #       dataset_std_v2  1.0e-3      +0.674      7.075    YES <- best on both
  #       dataset_std_v2  3.0e-3      +0.464      7.212    yes
  #
  #     1.0e-3 / 2.0e-4 = 5.0. Note 3.0e-3 DEGRADES, so this is an optimum and
  #     not the edge of the grid. Note also that v2's advantage is what makes the
  #     high rate usable: at 1.0e-3 it pays 7.075 nats where the per-sample
  #     LayerNorm pays 8.445.
  #
  #     This does NOT discharge ISSUE-012. `sbc_ks_pvalue_min` is 0.000 in every
  #     informative cell, and the sweep's SBC is not comparable to production's
  #     (its val set is shuffled, not backend-stratified). Run 4 launches with
  #     calibration UNKNOWN and that is stated in the model card.
  lr_scale: 5.0

model:
  # ISSUE-008's fix, and the two fields that bound its cost.
  #
  # A BOLD window is 8 target frames at TR = 2 s. Rolling the neural clock for
  # the duration each frame covers is 250 steps per frame at dt_model = 8 ms, so
  # all 8 frames is 2,000 rollout steps against run 3's 8. That does not fit.
  #
  # ONE, and it is `bold_predict_frames` that was cut rather than `batch`.
  #
  # 2 frames OOM'd at step 1 against the 56 GB cap; 1 fits at 52.54 GB reserved.
  # The choice between the two levers is not arbitrary. The BOLD term alone
  # accounts for 17.0 GB of the 52.54 -- measured, by running the same
  # configuration with the term switched off -- so it is the term that does not
  # fit, and halving `batch` would have degraded all seven measured sources to
  # pay for one. `bold_predict_frames` degrades exactly the thing that is too
  # expensive.
  #
  # WHAT IS LOST, PLAINLY. One frame at TR = 2 s is 2 s of predicted
  # haemodynamics from 48 s of context. The BOLD response peaks around 5 s, so
  # this term constrains the RISE of the response and not its peak or its
  # undershoot, and no claim about HRF shape may be read off this run. That
  # belongs on the model card beside any fMRI number. It is still 250 integrated
  # ODE steps where run 3 had none.
  #
  # The next lever, if two frames are wanted, is a per-source BOLD batch: this
  # term already runs at batch 4 (`max(4, data.batch // 8)`) while the others run
  # at 8, and dropping it further would buy the horizon without touching them.
  # That is a code change and 004 does not make it.
  bold_predict_frames: 1
  # EVERY step. A duty cycle buys step time and NOT memory -- on the steps it
  # runs, the peak is identical -- so it was never the lever for the OOM, and
  # raising it would reduce the evidence behind the fMRI likelihood to pay for
  # ~1 s/step. The fMRI likelihood is half of what this run is for.
  bold_every: 1

data:
  # 8, unchanged from run 3 and RE-MEASURED rather than inherited. Run 3's
  # comment records 41.97 GB allocated / 43.40 GB reserved at this batch on the
  # old BOLD path; run 4 measures 50.50 / 52.54 on the new one. Same batch,
  # +9 GB, and the 9 comes from the Balloon ODE.
  batch: 8

  # ISSUE-014, discharged here because it can only be discharged at the start of
  # a run. Run 3 inherits `shuffle_slice_v1`, which assigns a participant's fold
  # from the WHOLE participant set: at run 3's own seed, removing one of the 109
  # eegmmidb participants reassigns 28 of the remaining 108 and moves 6 of them
  # from train into test. `evaluate_model` rebuilds the split from whatever
  # corpus is on disk, so one recording that fails to preprocess is enough, and
  # the failure reads BETTER when broken -- a memorised participant promoted into
  # the test fold improves the held-out score.
  #
  # `stable_hash_v2` assigns each participant from their own group key and the
  # seed alone. The same removal moves 0 of 108. Measured on this roster at
  # seed 20260807, the realised folds are 67 train / 17 val / 25 test against
  # 71/11/27 -- looser proportions, bought with a holdout that cannot drift.
  #
  # This is a DIFFERENT SPLIT from run 3's, deliberately. Run 4's numbers are
  # therefore not directly comparable with run 3's held-out table, and
  # `real_split.policy` in every 004 artifact says which one produced it.
  split_policy: stable_hash_v2

train:
  run_name: scwbd-004
  out_dir: checkpoints/scwbd-004
  report_dir: reports/training
  seed: 20260809
  # 56 GB, unchanged from 003 and re-justified against 004's own measurement
  # rather than inherited: see the cost block at the top of this file. The GB10
  # has ONE ~121 GB unified pool and `systemd MemoryMax` does not bound CUDA
  # allocations, so this is the only ceiling on the caching allocator.
  # 56 -> 80 GB, and this is the one number in this file set from a MEASUREMENT
  # OF ALL SIX STAGES rather than of T1.
  #
  # 56 was fitted to a cost run that measured T1's loss set only, and this file
  # said so: "T4 admits the simulator as well and is not this loss set ... a
  # planning number, not a measurement of the run." The pre-launch smoke then
  # measured the run, and T4 died at the cap -- it wanted 352 MiB more than 56
  # GB, about 5,400 steps and ~14 h into a real run.
  #
  # Re-measured with the cap lifted, one smoke walking all six stages
  # (reports/training/, `gpu_reserved_gb` at each stage's step 1):
  #
  #     T1_measured_founding   47.41 GB
  #     T2_calibration         49.17 GB
  #     T3_population_prior    49.17 GB
  #     T4_simulator           57.98 GB
  #     T5_measured_return     59.95 GB   <- PEAK
  #     T6_individual          59.95 GB
  #
  # The peak is T5, NOT T4. A cap fitted to T4's 58 would have died one stage
  # later -- which is the same mistake that produced this blocker, made twice.
  #
  # 80 is 33% headroom over 59.95. The machine is 121.6 GB and the pool is
  # UNIFIED -- GPU and host share it, `systemd MemoryMax` does not bound CUDA,
  # and misreporting it as "RAM plus GPU" is what OOM'd this box. 80 leaves 41.6
  # GB host-side; during the measurement (cap 75) MemAvailable never fell below
  # 46 GB with a watchdog armed at 10.
  #
  # Still a real ceiling, which is the point: it is the only thing bounding the
  # caching allocator, and it is what stopped the 2-frame arm from taking the
  # box down. Raised against evidence, not removed.
  cuda_reserve_gb: 80.0
  # 46 h. 14,600 steps at the measured 9.30 s/step is 37.7 h, and that rate is
  # T1's applied to every stage -- T4 admits the simulator as well and was not
  # measured. Run 3 finished 13,400 steps inside 30 h on a path whose BOLD term
  # rolled 8 neural steps instead of 250.
  max_wall_seconds: 165600
  resume: true

  stages:
    # ---- 1 -----------------------------------------------------------------
    - name: T1_measured_founding
      steps: 4000
      lr: 6.0e-4
      warmup: 200
      log_every: 20
      ckpt_every: 500
      lambda_obs: 1.0
      lambda_forecast: 1.0
      lambda_posterior: 0.0
      lambda_anat: 0.0
      lambda_perturb: 0.0
      extra:
        curriculum:
          scope: regional + interface, measured only
          admits: [1]
          tier_permissions:
            1: ["family_local.*", "family_residual.*",
                "coupling.*", "msg_readin.*", "assimilate.*",
                "context.*", "family_readout.*", "observation.*",
                "eeg.*", "eeg_montages.*", "bold.*", "behaviour.*"]
          objective: [likelihood, forecast, port]
          rationale: >-
            As 003, with one difference that is not a curriculum change: `bold.*`
            now reaches a Balloon-Windkessel integrator that actually runs, so
            log_kappa, log_gamma, log_tau, alpha and neural_gain receive gradient
            from this stage instead of sitting bit-identical to their
            initialisation for the whole run.
    # ---- 2 -----------------------------------------------------------------
    - name: T2_calibration
      steps: 600
      lr: 3.0e-4
      warmup: 60
      log_every: 20
      ckpt_every: 300
      lambda_obs: 1.0
      lambda_cal: 0.3
      lambda_posterior: 0.0
      lambda_anat: 0.0
      extra:
        curriculum:
          scope: instrument nuisance
          admits: [1, 2]
          tier_permissions:
            1: ["family_local.*", "family_residual.*",
                "coupling.*", "msg_readin.*", "assimilate.*",
                "context.*", "family_readout.*", "observation.*",
                "eeg.*", "eeg_montages.*", "bold.*", "behaviour.*"]
            2: ["eeg.log_gain", "eeg.offset", "eeg.log_noise", "eeg.nuisance*",
                "eeg_montages.*.log_gain", "eeg_montages.*.offset",
                "eeg_montages.*.log_noise", "eeg_montages.*.nuisance*"]
          objective: [likelihood, calibration]
          rationale: >-
            Per-channel gain, offset and noise floor across four montages.
            Admitted late and narrowly: a calibration source has tiny measurement
            variance and would win a pure inverse-variance contest.
    # ---- 3 -----------------------------------------------------------------
    - name: T3_population_prior
      steps: 800
      lr: 3.0e-4
      warmup: 80
      log_every: 20
      ckpt_every: 400
      lambda_anat: 0.05
      lambda_posterior: 0.0
      extra:
        curriculum:
          scope: anatomical prior
          admits: [1, 2, 3]
          tier_permissions:
            1: ["family_local.*", "family_residual.*",
                "coupling.*", "msg_readin.*", "assimilate.*",
                "context.*", "family_readout.*", "observation.*",
                "eeg.*", "eeg_montages.*", "bold.*", "behaviour.*"]
            2: ["eeg.log_gain", "eeg.offset", "eeg.log_noise", "eeg.nuisance*",
                "eeg_montages.*.log_gain", "eeg_montages.*.offset",
                "eeg_montages.*.log_noise", "eeg_montages.*.nuisance*"]
            3: ["coupling.gain_*", "coupling.global_scale"]
          objective: [likelihood, forecast, anatomy]
          rationale: >-
            The 9-family partition and the connectome scale enter after the
            measured sources have fixed the representation they modulate.
    # ---- 4 -----------------------------------------------------------------
    - name: T4_simulator
      steps: 5000
      lr: 2.0e-4
      warmup: 250
      log_every: 20
      ckpt_every: 500
      lambda_posterior: 1.0
      lambda_kl: 0.01
      lambda_slice: 1.0
      lambda_anat: 0.05
      extra:
        curriculum:
          scope: simulator-conditioned inference
          admits: [1, 2, 3, 4]
          # `with_hemo` is NOT set. `sim_losses` reads `roll.activity` and never
          # `roll.hemo`, so turning it on here would integrate the Balloon
          # compartments and discard them -- compute spent to make a flag read
          # as though the physics were engaged. The measured BOLD path is where
          # the ODE runs and where a loss consumes it.
          tier_permissions:
            1: ["family_local.*", "family_residual.*",
                "coupling.*", "msg_readin.*", "assimilate.*",
                "context.*", "family_readout.*", "observation.*",
                "eeg.*", "eeg_montages.*", "bold.*", "behaviour.*"]
            2: ["eeg.log_gain", "eeg.offset", "eeg.log_noise", "eeg.nuisance*",
                "eeg_montages.*.log_gain", "eeg_montages.*.offset",
                "eeg_montages.*.log_noise", "eeg_montages.*.nuisance*"]
            3: ["coupling.gain_*", "coupling.global_scale"]
            4: ["family_local.*", "family_residual.*",
                "coupling.*", "msg_readin.*", "assimilate.*",
                "context.*", "family_readout.*", "posterior.*"]
          objective: [likelihood, forecast, slice, posterior]
          rationale: >-
            The amortised posterior is founded here and only here; no measured
            recording carries a theta label. Tier 4 does NOT reach `eeg.*`,
            `eeg_montages.*`, `bold.*` or `behaviour.*`: a simulator may not
            calibrate an instrument.
    # ---- 5 -----------------------------------------------------------------
    - name: T5_measured_return
      steps: 3000
      lr: 1.2e-4
      warmup: 150
      log_every: 20
      ckpt_every: 500
      lambda_obs: 1.0
      lambda_forecast: 1.0
      lambda_perturb: 1.0
      lambda_posterior: 0.2
      lambda_anat: 0.02
      extra:
        curriculum:
          scope: return to measured
          admits: [1, 2]
          tier_permissions:
            1: ["family_local.*", "family_residual.*",
                "coupling.*", "msg_readin.*", "assimilate.*",
                "context.*", "family_readout.*", "observation.*",
                "eeg.*", "eeg_montages.*", "bold.*", "behaviour.*",
                "tms_drive.*"]
            2: ["eeg.log_gain", "eeg.offset", "eeg.log_noise", "eeg.nuisance*",
                "eeg_montages.*.log_gain", "eeg_montages.*.offset",
                "eeg_montages.*.log_noise", "eeg_montages.*.nuisance*"]
          objective: [likelihood, forecast, perturbation]
          rationale: >-
            The 1 -> 4 -> 1 return, so the final population weights are
            conditioned on evidence rather than on the generator. `tms_drive.*`
            is granted here and nowhere else.
    # ---- 6 -----------------------------------------------------------------
    - name: T6_individual
      steps: 1200
      lr: 6.0e-4
      warmup: 60
      log_every: 20
      ckpt_every: 300
      lambda_obs: 1.0
      lambda_forecast: 1.0
      lambda_perturb: 0.0
      lambda_posterior: 0.0
      lambda_anat: 0.0
      extra:
        curriculum:
          scope: person and session effects, population weights frozen
          admits: [1]
          individualize: true
          tier_permissions:
            # `individualizer.*` and the observation nuisance, and NOTHING
            # regional. This is the one stage in the run that cannot name
            # `family_local`, and that is the design: the question is whether a
            # person effect over theta predicts a held-out night GIVEN the
            # population model, so letting the dynamics move here would answer a
            # different question and would also make the held-out comparison
            # against `stage_T5_measured_return.pt` incoherent.
            #
            # The optimiser is narrowed to the same set in `run_stage`; the
            # permission is what governs, and the two agree on purpose.
            1: ["individualizer.*",
                "eeg.log_gain", "eeg.offset", "eeg.log_noise", "eeg.nuisance*",
                "eeg_montages.*.log_gain", "eeg_montages.*.offset",
                "eeg_montages.*.log_noise", "eeg_montages.*.nuisance*"]
          objective: [likelihood, forecast]
          rationale: >-
            75 of sleep-edfx's 78 participants were recorded on two consecutive
            nights, and it is the only corpus here with a second session of the
            same person. The effect is fitted on the training nights and scored
            on the held-out one by `session_individualisation`, per participant
            with a cluster bootstrap over participants. A learning rate at the
            T1 level rather than a decayed one, because these tensors start at
            zero and have 1,200 steps to leave it -- the population weights they
            modulate are frozen, so there is nothing for a large step to
            destabilise.
            The falsifier is stated in the evaluation and not softened here: if
            the between-participant spread of the applied theta shift is at or
            near zero on a split built to let it be non-zero, the third
            capability is unsupported and the site says so.

arm:
  role: treatment
  justification: >-
    Heterogeneous region-indexed state with per-family operators
    (`family_state: true`), as 003. 004 changes the BOLD likelihood and adds a
    fitted person effect; neither touches the arm.
notes: >-
  SC-WBD-004. Two structural changes on 003: the measured fMRI likelihood
  integrates the Balloon-Windkessel ODE across the interval a BOLD frame covers
  rather than indexing 8 neural steps against 8 TRs, and a person/session effect
  is fitted in a sixth stage on sleep-edfx's two-night structure. The BOLD
  horizon is REDUCED to `bold_predict_frames` of 8 target frames to pay for the
  first; that reduction belongs on the model card next to any fMRI number.
