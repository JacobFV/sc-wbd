# Smoke override for configs/run4/scwbd-004.yaml.
#
# A DISTINCT `train.run_name`, not just a distinct `--out`. `--out` moves the
# checkpoints; the JSONL log is keyed by run_name, so a smoke run sharing the
# name would append to the production log and the two would be indistinguishable
# afterwards.
#
# This file exists because the run-4 launch script did NOT do that. Its step 5
# ran `train --config configs/run4/scwbd-004.yaml --quick --out
# checkpoints/scwbd-004-smoke`, which moved the checkpoints and left the log
# keyed `scwbd-004` -- so the smoke created `reports/training/scwbd-004_train.jsonl`,
# the production log of a run that has not started. Caught at 0 bytes, before
# anything was written, by `make health-run4` reporting "log is EMPTY" where it
# had reported "log NOT FOUND" an hour earlier. That is ISSUE-010's defect class
# exactly, and `configs/run3/smoke.yaml` already carried the warning against it.
base: scwbd-004.yaml
train:
  run_name: scwbd-004-smoke
  out_dir: checkpoints/scwbd-004-smoke

  # The REPORT directory too, not just the log key and the checkpoint dir.
  #
  # `run_stage` writes each mixture report TWICE: run-scoped under
  # `report_dir/<run_name>/`, and to a legacy FLAT `report_dir/mixture_<stage>.json`
  # that every run overwrites by design. Run 4 reuses run 3's stage names, so the
  # smoke overwrote `mixture_T1_measured_founding.json` and four siblings --
  # 22,113 lines of run 3's T1 report replaced by 81 lines of smoke. They are
  # tracked, so `git checkout` restored them; run 3's run-scoped directory holds
  # only T4, because the run-scoped write landed mid-run, so for T1/T2/T3/T5 the
  # FLAT files are run 3's only record.
  #
  # Redirecting the DIRECTORY is the fix, not enumerating the outputs. ISSUE-010
  # took five attempts precisely because each one redirected one more output --
  # ckpt_every, then log_every, then the logger, then out_dir -- and something
  # was still writing to a production path each time. One directory covers the
  # jsonl, the summary, the run-scoped reports and the flat ones together.
  report_dir: reports/training/smoke-004

  resume: false
  # Long enough to reach every loss path once. The smoke's job is to make each
  # term raise if it is going to, not to produce a number.
  max_wall_seconds: 3600

  # 4 steps per stage, so the smoke REACHES ALL SIX.
  #
  # `--quick` shrinks the participant rosters and does not touch step counts, so
  # the first working smoke ran T1's 4,000 steps at ~9.3 s/step, hit
  # `max_wall_seconds`, and stopped -- never entering T4 or T6, which carry this
  # run's new code: the amortised posterior's rewritten conditioning (ISSUE-012)
  # and the first fitted individualiser. A smoke that exercises only the paths
  # that already worked is not the check HANDOFF-004 step e asks for.
  #
  # 4 rather than 1: a single step cannot show a loss term that raises on its
  # SECOND batch, which is where a stale cached shape or an exhausted iterator
  # shows up. ONE_CYCLE_MIN_STEPS is 3, so 4 also clears the scheduler's floor.
  #
  # NEVER set this in a run config -- it silently truncates training.
  # `scripts/launch_run4.sh` step 2 refuses a run whose config sets it.
  max_steps_per_stage: 4
data:
  batch: 8
