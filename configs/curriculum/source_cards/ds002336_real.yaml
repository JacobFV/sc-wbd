# Simultaneous EEG + fMRI, motor-imagery neurofeedback (Lioi et al., XP1).
# Dataset card: scwbd/sources/cards/ds002336.yaml   Licence: CC0-1.0.
#
# WHY THIS IS A PER-DATASET CARD AND NOT A "haemodynamic_real" CARD.
# ---------------------------------------------------------------------------
# It was written as one combined card first, and that was a LICENCE DEFECT.
# scwbd.release.datasets.link_sources_to_datasets maps ONE mixture id to at
# most one dataset card, by normalising the id (`<x>_real` -> `<x>`) and
# matching it against scwbd/sources/cards/. A combined `haemodynamic_real`
# matched nothing, so `licence_terms()` bound it to UNKNOWN_TERM -- and the
# checkpoint would have carried "unknown" instead of the obligations of the two
# datasets it actually trained on. Verified by calling build_manifest() and
# reading the link, not by reading the code.
#
# Splitting per dataset also keeps the two licences apart, which matters here:
# ds002336 is CC0 and ds000113's licence is UNRESOLVED. Combined, the union
# would have made the CC0 half unknown too, for no reason.
#
# STILL DISABLED, but the reason has changed and the old one is no longer true.
#
# WAS: "no registration between them has been run". That was accurate and read
# as "none is available" -- scwbd/anatomy/registration.py had the whole chain
# and was imported by nothing but its own test.
#
# NOW RUN, 2026-08-06, on sub-xp102/task-motorloc:
#   379 of 400 parcels covered, 21 unobserved (NaN, never 0.0), 161 s
#   EPI<-T1w rigid 6-DOF (MI); T1w<-MNI152NLin6Asym affine (MI)
#   see scwbd/sources/parcellate_bold.py and
#       reports/sources/ds002336_parcellation.md
#
# ENABLED. This is the directory TRAINING reads (cfg.mixture_cards) -- see the two-directory note below.
# configs/source_cards/ is read by the RELEASE path (licence, attribution,
# manifest: 17 references). configs/curriculum/source_cards/ is what TRAINING
# reads (cfg.mixture_cards). Enabling here would add this dataset's terms to a
# published model card without any checkpoint having trained on it -- a licence
# claim ahead of its evidence, which is the same error as linking a model before
# its scores exist. It is enabled in the CURRICULUM directory, and it belongs
# here the moment a checkpoint has actually consumed it.
#
# The loader exists (scwbd/foundation/bolddata.py) and the
# cache is built: 10/10 runs, 10 participants, 89 windows, 0 dropped for
# coverage. Items are {bold (T,N), bold_mask (N,), subject, run, source, tr},
# which is what FoundationTrainer.real_bold_losses consumes.
#
# Per-subject coverage measured across all ten, and it is NOT uniform:
#   xp103/106/108  400/400      xp101 399    xp107 395    xp105 391
#   xp109 384      xp102 379    xp104 378    xp110 357/400  (0.8925)
# Uncovered parcels are NaN and excluded by the mask; xp110 alone has 43 of
# them. A global mask would be wrong for six of these ten subjects, which is why
# the mask travels per run.
#
# Note the coverage basis: field_of_view, not brain_mask. 379/400 is an upper
# bound on usable parcels, not a count of good ones, and the registration module
# says so itself.
# SECOND BLOCKER, added 2026-08-06 after 🧠 Cajal's D9 slab finding. The EPI is
# a 128 mm slab, not a head, and whether it contains each subject's whole
# brain is UNKNOWN (no segmentation tool is installed to settle it). Parcels
# outside the slab have no measurement in any subject, systematically, by
# acquisition. Enabling this card before a declared per-parcel coverage mask
# exists would contribute a likelihood term for regions with no observation
# operator at all -- an imputation, and rule 1 forbids it.
#
# This is enforced, not just written here: `spatial.coverage.whole_brain` is
# `unknown` on the dataset card and is named in the `requires` of every
# BOLD-facing gradient target, so Appendix B disables those paths by itself.
# Setting `enabled: true` on this file is NOT sufficient to train `bold.*`.

id: ds002336_real
role: likelihood
enabled: true
is_simulated: false
is_simulated: false
losses: [likelihood, forecast]

gradient_permission:
  - "bold.*"          # the observation head only a haemodynamic source may calibrate
  - "coupling.*"
  - "local.*"
  - "readout.*"
frozen:
  - "eeg.*"           # the raw EEG here is gradient-artefact dominated; it may
                      # not calibrate a scalp montage. Use the eeg_pp derivatives
                      # through a separate, declared source if that is wanted.
  - "individualizer.*"

# Regenerated from disk (`python -m scwbd.sources.inventory ds002336`):
# 10 participants, 55 BOLD runs, 54 EEG runs, 5.22 h BOLD, 5.81 h EEG.
# n_eff is PARTICIPANTS. n_rows is runs, for audit only.
n_eff: 10.0
n_rows: 55.0
n_participants: 10
n_sites: 1
hierarchy_depth: 2

# null, not a number: neither the release nor the paper bounds BOLD measurement
# variance or haemodynamic mis-specification for this acquisition. A None
# disables the dependent path; a plausible-looking float would not.
measurement_variance: null
bias_halfwidth: null
bias_status: unknown
model_discrepancy: null
validity_overlap: 1.0
leakage_audited: false

compiler_permission:
  - "port:*.bold_out"
  - "observation:ds002336_real:nuisance"

notes: >-
  The only fully paired episode in the register (body.tex 6.4): EEG at 5000 Hz
  and BOLD at 0.5 Hz on the same subject in the same 20 s block, a 10,000:1
  rate ratio. Pairing is complete for 53 of 56 (subject, task) runs; the three
  unpaired runs are excluded from cross-modal terms, never half-imputed.
