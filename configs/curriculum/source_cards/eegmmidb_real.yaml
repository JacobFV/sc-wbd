# TIER 1 -- likelihood, measured, full provenance.
# PhysioNet EEG Motor Movement/Imagery Database. 109 participants, 64 channels,
# 160 Hz, ODC-BY 1.0. This is the source that FOUNDS the representation: every
# lower tier admitted later must have its mask contained in this one.
#
# Derived from configs/source_cards/eegmmidb_real.yaml. Differences, all of them:
#   + observes:                 so the measured-information rule (X05) is evaluable
#   + dataset_id / provenance:  so the tier derivation is explicit, not defaulted
#   (nothing was widened; the permission set is unchanged)
id: eegmmidb_real
role: likelihood

# The founding montage's channel declaration. This card predates the attachment
# axis and carried no `channels:` block at all, which had a consequence nobody
# would have looked for: `attachment_of` refuses a channel its card does not
# declare, so the per-attachment-kind report omitted THE FOUNDING SOURCE from
# the `observation` row. The 109-participant corpus that founds the
# representation was absent from the table that says which kinds of signal
# reached the model.
#
# Not a training defect -- the gradient path never consulted this block -- but
# the report is a published claim, and it was answering "which sources
# contribute an observation" without the largest one.
channels:
  eeg:
    attachment: observation
    n_channels: 64
    units: V
    clock: bci2000_amp
    operator: lead_field
    note: >-
      Extended 10-10 Sharbrough montage at 160 Hz, brought to the model's
      125 Hz. Average-referenced: the raw files are referenced to a single
      electrode, which makes the topography reference-dependent, and the common
      average is the least arbitrary choice available without an individual head
      model. This is the montage `model.eeg` owns; every other EEG source
      observes through its own operator in `model.eeg_montages`.

is_simulated: false
losses: [likelihood, forecast, calibration, posterior]
gradient_permission:
  # The family-padded arm prefixes the regional modules (`family_local`,
  # `family_residual`, `family_readout`); the pooled arm does not. Both
  # namings are granted because both arms are live, and a glob that matches
  # nothing is an EMPTY permission set rather than an error -- which is how
  # run 2 trained 11.3% of its parameters and shipped. See RUN2.md §4.
  - "local.*"
  - "family_local.*"
  - "residual.*"
  - "family_residual.*"
  - "coupling.*"
  - "msg_proj.*"
  - "msg_readin.*"
  - "assimilate.*"
  - "context.*"
  - "readout.*"
  - "family_readout.*"
  # `observation.*` -- the per-family projection into observation space --
  # was reachable by NO card in run 2 and sat at its initialisation for the
  # whole run while on the forward path. Granted here to the sources whose
  # likelihood it serves. This is a modelling decision made deliberately
  # rather than a test being made green: leaving it unreachable now would
  # repeat a defect already measured. `behaviour.*` is NOT granted -- no
  # source declares a boundary_output channel yet, so nothing has evidence
  # about it, and that absence is the honest state.
  - "observation.*"
  - "eeg.*"
  - "log_dt_scale"
  - "individualizer.*"
frozen:
  - "bold.*"   # no haemodynamics were measured; an EEG corpus may not train BOLD.
               # Now a measured fact rather than a judgement: the expected Fisher
               # information of the EEG observation block for beta_hrf, c_under and
               # gain_bold is exactly 0.0 in all three identifiability regimes.
n_eff: 109.0
n_rows: 1526.0
n_participants: 109
n_sites: 1
hierarchy_depth: 3
measurement_variance: 0.35
bias_halfwidth: 0.20
bias_status: prior_specified_sensitivity
model_discrepancy: 0.0
validity_overlap: 1.0
notes: >
  Scalp EEG during rest, real and imagined movement. Single site, single montage,
  no individual head models: supports population-level EEG prediction claims only.
  290,673 windows on disk; the leakage-audited split is 189,765/29,238/71,670
  windows over 71/11/27 of the 109 participants (train_main.log lines 22, 126-129).
compiler_permission:
  - "operator:local_field:*"
  - "operator:long_range:*"
  - "operator:assimilation:*"
  - "region:*:state:*"
  - "port:*.message_out"
  - "port:*.message_in"
  - "port:*.eeg_out"
  - "observation:eegmmidb_real:nuisance"
