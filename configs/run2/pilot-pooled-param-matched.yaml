# RUN 2 PILOT -- control arm (pooled vector per region, parameter-matched).
#
# **The pilot's numbers are NOT the A1 endpoint and may not be reported as one.**
# See configs/run2/pilot-families.yaml for the full pre-commitment: two designs,
# both fixed in writing before either ran, the endpoint being 4-fold participant
# CV regardless of what this run says.
#
# Split identical to the treatment arm by construction -- same `seed`, same
# `real_test_fraction`, same `_assign_groups` -- so the two arms see the same 54
# test participants and the paired comparison is paired in the participants as
# well as in the windows.
#
# HELD IDENTICAL TO THE TREATMENT ARM (PREREG_A1_run2 §3.6, binding):
#   * operator assignment: `local_core: learned` for every parcel in both arms.
#     A1's arms differ ONLY in state structure. Varying the operator here would
#     confound A1 with A5 and neither would be testable.
#   * parameters: 1,863,600 here vs 1,858,597 there, +0.27%, MEASURED against
#     the real 414-parcel prior rather than read off a config comment. The base
#     file's hidden=288 gives 1,715,040 (-7.72%) and is not an acceptable
#     control -- see scwbd-001-pooled-param-matched.yaml for why those figures
#     had to be regenerated.
#   * corpus, anatomy, curriculum, seed, stage schedule, optimiser steps (B3).
#   * `state_dependent_variance: true` -- RL-4, BOTH arms build the observation
#     interface. Making the state-dependent variance path a property of which
#     arm you are in would silently widen one arm.
#
# THIS IS THE B1 MATCH ONLY. §3.2 requires B1 (parameters) and B2 (total state
# width) both, because they cannot hold simultaneously and picking the flattering
# one afterwards is the failure the two-arm rule exists to prevent.
# `pooled_vector_per_region@state_matched` does not exist yet and A1 is
# incomplete without it.

base: scwbd-001-pooled-param-matched.yaml

data:
  real_test_fraction: 0.50

train:
  run_name: scwbd-001-pilot-pooled-param-matched
  out_dir: checkpoints/scwbd-001-pilot-pooled-param-matched

notes: >-
  RUN 2 PILOT, equal-parameter generic-operator control arm. De-risking run at
  54 test / 44 train, single fold. NOT the A1 endpoint. Paired with
  configs/run2/pilot-families.yaml.
