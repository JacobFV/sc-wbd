# SC-WBD-001 RUN 2 -- `pooled_vector_per_region@param_matched`.
#
# PREREG_A1_run2 §3.2 B1: the equal-PARAMETER pooled-vector control. One learned
# operator and one pooled state vector for all 414 parcels, at a width chosen so
# the parameter count matches the treatment arm rather than at whatever width the
# base file happened to carry.
#
# MEASURED, not asserted -- built both models against the real 414-parcel prior
# and counted `SCWBD.parameter_report()`:
#
#   treatment (scwbd-001-families.yaml)   2,512,492
#   this file  (hidden: 418)              2,500,444     -0.48%
#   base file  (hidden: 288)              1,688,130    -32.8%
#
# RE-MEASURED 2026-08-06 on the MERGED tree. The previous values in this header
# (1,858,597 / 1,863,600 at hidden=314, "+0.27%") were measured on a branch 34
# commits behind master and are wrong by 26%: at hidden=314 the control is
# -25.83% against the current treatment arm, not +0.27%. X_i^uncertainty and the
# per-family propagator landed in between and grew the treatment arm by ~35%.
#
# The lesson is the header, not the number: a capacity match is a measurement
# against a specific tree and does not survive a merge. Re-derive it whenever
# either arm moves, and never inherit it across one.
#
# +0.27% is inside `scwbd.dynamics.assert_equal_capacity`'s 10% tolerance with
# three orders of margin. The base file at 288 is not: it hands the treatment arm
# a 7.7% capacity advantage, and a win at those two numbers would be
# unattributable between structure and size.
#
# NOTE the numbers in `scwbd-001-families.yaml`'s own header (2,376,452 vs
# 1,675,373, "1.42x") are STALE. They predate the real 414-parcel prior, the
# nine-family partition it actually produces, and Hodgkin's observation
# interface. Corrected there in the same commit as this file. Regenerate before
# quoting: the ratio is 1.084, not 1.42.
#
# THIS IS ONE OF TWO CAPACITY MATCHES AND CANNOT BE THE ONLY ONE.
# §3.2 requires B1 (parameters) and B2 (total state width) BOTH, because they
# cannot be satisfied simultaneously -- matching parameters leaves the state
# widths different and vice versa. Choosing whichever one flatters the result
# after the fact is the failure the two-arm requirement exists to prevent.
# `pooled_vector_per_region@state_matched` is NOT in this directory yet and A1
# is incomplete without it.
#
# WHAT IS HELD IDENTICAL TO THE TREATMENT ARM (§3.6, binding design ruling):
#   * operator assignment -- `local_core: learned` for every parcel in both arms.
#     A1's arms differ ONLY in state structure. Letting this arm also vary the
#     operator family would confound A1 with A5 and neither would be testable.
#   * corpus, anatomy, curriculum, seed, stage schedule, optimiser steps (B3).
#   * `state_dependent_variance: true` -- ARCHITECTURE.md §5b RL-4. BOTH arms
#     build the observation interface. Making the state-dependent variance path
#     a property of which arm you are in would silently widen one arm, which is
#     the same class of defect as the narrowing Hodgkin found on the mean path.

base: scwbd-001.yaml

arm:
  role: control
  controls_for: "11.4:structured_regional_state"
  # NOTE: `match: parameters` belongs here and there is no field for it --
  # ArmConfig declares only role/controls_for/justification, so which of §3.2's
  # two incompatible capacity matches an arm implements is currently expressible
  # only as prose. That is a gap in R12's schema (📜 Noether's), not in this
  # file: a B1-matched and a B2-matched control are different controls and a
  # registry that cannot tell them apart cannot enforce that both were run.
  justification: >
    Equal-parameter (B1) pooled-vector control for A1. One operator and one pooled
    state vector for all 414 parcels at hidden=418, giving 2,500,444 parameters
    against the treatment arm's 2,512,492 (-0.48%, re-measured on the merged
    tree; the earlier +0.27% at hidden=314 was measured 34 commits behind and
    is off by 26%).
    Operator assignment is identical to the treatment arm, so the only thing
    that varies is state structure. This is the B1 match only; the B2
    state-width match is a separate arm and A1 needs both.

model:
  family_state: false
  hidden: 418

train:
  run_name: scwbd-001-pooled-param-matched
  out_dir: checkpoints/scwbd-001-pooled-param-matched

notes: >-
  Equal-parameter generic-operator control arm for body.tex §11.4's first
  required ablation. Paired with configs/run2/scwbd-001-families.yaml. Capacity
  match measured at +0.27%; see this file's header for the counts and for why
  the base file's hidden=288 is not an acceptable control. Not yet trained.
