# SC-WBD-001 RUN 2 -- the TREATMENT arm of body.tex §11.4's first ablation.
#
# `scwbd-001.yaml` (the base) is the CONTROL: one `local_core` string and one
# 28-wide state vector for all 414 parcels. That is "one scalar or pooled vector
# per region", the second half of §11.4's
#
#     structured regional state versus one scalar or pooled vector per region
#
# and it is what run 1 shipped under the name of the first half
# (reports/scope_gap.md). This file is the first half.
#
# Both files must be run. The control is not a strawman to be skipped -- it is
# the equal-capacity comparison the claim rests on, and Popper needs it.
#
# EVERY PRECONDITION OF THE BASE FILE STILL APPLIES (P1..P4). This file adds no
# new blocker and removes none. Nothing here has been trained.
#
# What changes, and the measurement behind each (reports/dynamics/family_state.md):
#
#   family_state: true
#       Regions partition into families declared by the anatomy prior. On the
#       real 414-parcel prior that is **NINE** families, measured by building the
#       model against `load_anatomy()` and reading `family_layout`:
#
#           cortex_association   262      subcortex_hippo    2
#           cortex_unimodal      138      subcortex_pal      2
#           subcortex_accumb       2      subcortex_put      2
#           subcortex_amyg         2      subcortex_thal     2
#           subcortex_caud         2
#
#       CORRECTION (2026-08-06, 🔥 Turing). This comment previously said ELEVEN
#       families -- "seven Yeo cortical networks + thalamus(2) +
#       basal_ganglia(8) + hippocampus(2) + amygdala(2)". The real prior does
#       not produce that. The cortical side is a **two-family split**
#       (association / unimodal), not a seven-network one, and the basal ganglia
#       arrive as four separate two-parcel families rather than one of eight.
#       The cerebellar family is absent, as the base file's `n_regions` comment
#       says.
#
#       WHAT THIS DOES TO A1's CONTENT. Seven of the nine families are
#       subcortical at n=2 parcels each -- 14 of 414, 3.1% -- which
#       PREREG_A1_run2 §3.6.4 already declares **out of claim** on power
#       grounds. So A1's licence covers the cortical partition, and the cortical
#       partition is TWO families. A1 tests whether splitting cortex into
#       association and unimodal beats one pooled operator. That is a much
#       narrower question than "eleven families", and §3.6.3's power table is
#       written against exactly it: a two-family cortical partition must produce
#       an effect comparable to the *state* term of the run-1 variance defect
#       (0.19-0.26 nats) to clear the MDE at all.
#
#   family_cores: {}
#       Left empty on purpose. The defaults in
#       `scwbd.foundation.families.DEFAULT_FAMILY_CORES` assign the engineered
#       backends body.tex §5 argues for (thalamic_relay, basal_ganglia_gate,
#       hippocampal_code) and leave the cortical families on `local_core`.
#       Overriding a family here is one line, e.g.
#           family_cores: {cortex_vis: wilson_cowan}
#       and a name that the anatomy prior does not produce RAISES rather than
#       silently doing nothing.
#
#   d_key/d_value/d_grid/d_context = 16/16/12/4
#       body.tex §5.1's H_t = {k,v,g,c,rho}. These set the padded width D for the
#       WHOLE state, because the layout is padded to max_f d_f (narrowing N-1):
#       with these values D = 59, and 52.26% of the (414, 59) state plane is pad.
#       Halving them would halve the waste and shrink the hippocampal code; that
#       trade is a live question, not a settled one. See N-1's "measured cost".
#
# Capacity is NOT matched to the base file, and the figures this comment used to
# carry (2,376,452 vs 1,675,373, "1.42x") were STALE -- they predate the real
# 414-parcel prior, the nine-family partition, and Hodgkin's observation
# interface. Regenerated 2026-08-06 against `load_anatomy()`:
#
#     this file                                  1,858,597
#     scwbd-001.yaml         (hidden: 288)       1,715,040   -7.72%
#     scwbd-001-pooled-param-matched.yaml (314)  1,863,600   +0.27%
#
# The real ratio to the base file is **1.084, not 1.42**. Do not report a
# comparison made against the base file at hidden=288: it hands this arm a 7.7%
# capacity advantage. Use `configs/run2/scwbd-001-pooled-param-matched.yaml`,
# which is the B1 match -- and note A1 also needs the B2 state-width match,
# which does not exist yet.

base: scwbd-001.yaml

model:
  family_state: true
  family_cores: {}
  d_key: 16
  d_value: 16
  d_grid: 12
  d_context: 4
  d_prediction: 8

train:
  run_name: scwbd-001-families
  out_dir: checkpoints/scwbd-001-families

notes: >-
  Treatment arm of body.tex §11.4's first required ablation: heterogeneous
  region-indexed state with per-family operators. Paired with
  configs/run2/scwbd-001.yaml, which is the equal-capacity generic-operator
  control. Neither has been trained. Refusal R12 refuses a heterogeneous-state
  claim on a checkpoint emitted from the control file.
