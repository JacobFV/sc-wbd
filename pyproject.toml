[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scwbd"
version = "0.1.0"
description = "SC-WBD-001-beta: compiled, multiresolution, multirate whole-brain modeling"
readme = "ARCHITECTURE.md"
requires-python = ">=3.12"
license = { text = "CC-BY-NC-SA-4.0" }
authors = [{ name = "SuperCognition Labs" }]
keywords = ["neuroscience", "whole-brain-modeling", "multimodal", "uncertainty"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pydantic>=2.9",
  "numpy>=2.0",
  "scipy>=1.14",
  "torch>=2.5",
  "pyyaml>=6.0",
  "h5py>=3.11",
  "scikit-learn>=1.5",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "rich>=13.0",
  "tqdm>=4.66",
  # Image registration (EPI -> T1w affine, T1w -> MNI SyN, and the inverse warp
  # the native-space direction needs).  dipy, not antspyx: antspyx 0.6.3 ships
  # arm64 wheels for macOS only, so on this aarch64 box it would build ITK+ANTs
  # from sdist.  dipy ships cp312-manylinux_2_17_aarch64 and was verified here.
  # Provenance note: this is SyN (Avants 2008) as implemented in dipy; the
  # Klein 2009 evaluation covers ANTs' implementation, not this one.
  "dipy>=1.12",
  "nibabel>=5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["scwbd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-m "not slow"` by DEFAULT, and this is a deliberate trade.
#
# Before it, `pytest tests/` could not be run to completion at all:
# tests/infer/test_recovery.py and tests/infer/test_synthetic_slice.py each
# exceed ten minutes with the machine otherwise idle, so any attempt to produce
# a complete failure list ran out of patience before it ran out of tests. The
# result was worse than a slow suite -- it was a suite whose state nobody knew,
# and "unmeasured" kept getting written down as "passing".
#
# Deselection is LOUD: pytest prints "N deselected" on every run, so the deferred
# set announces itself rather than disappearing. That is the whole difference
# between this and silently dropping them.
#
# The slow set must still be run. It is not optional and it is not a lower tier:
#     pytest -m slow                      # ~25 min, 10 files
# reports/RUN2.md §5b records the runtimes and what is in it.
addopts = "-q -m 'not slow'"
markers = [
    # Registered so a typo (`@pytest.mark.slwo`) is an ERROR rather than an
    # unrecognised marker that silently matches nothing -- which would put a
    # test in neither the fast set nor the slow one.
    "slow: takes minutes; deselected by default, run with `pytest -m slow`",
]
filterwarnings = ["error::DeprecationWarning:scwbd.*"]
