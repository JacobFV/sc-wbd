schema_version: scwbd-source-card/1.0.0

# =====================================================================
# UNAVAILABLE SOURCE.  Registered so the dataset register is complete and
# honest, NOT downloaded.  Appendix A lists this family as a candidate; the
# governance block below is the reason it is not in the training mixture.
# No bytes of this dataset exist on the local data root.
# =====================================================================
identity:
  id: ram-intracranial
  name: "DARPA Restoring Active Memory (RAM) intracranial EEG with stimulation"
  version: "unknown"              # no release is pinned because nothing was fetched
  release_date: "unknown"
  doi: "10.1038/s41467-018-02753-0"
  citation: >-
    Ezzyat Y et al. (2018). Closed-loop stimulation of temporal cortex rescues functional networks and improves memory. Nature Communications 9:365.
  source_url: "http://memory.psych.upenn.edu/RAM"
  download_url: null
  download_method: "not attempted - see governance.unavailable_reason"
  retrieved_utc: null
  parent_dataset: null
  derived_from: null
  derivatives_included: []
  software: {}
  container_hash: unknown
  local_path: null
  file_manifest: null

governance:
  license_spdx: "DUA-RAM"
  status: unavailable
  unavailable_reason: >-
    the RAM public release requires registration and acceptance of a data use agreement, and the data are human intracranial recordings with concurrent direct electrical stimulation. No registration was completed and nothing was downloaded. Even with access, the stimulation arm would be evaluation-only here: ARCHITECTURE.md forbids optimising an intervention outside an independently validated A_safe (R11).
  license: "RAM public data use agreement (registration required)"
  license_url: "http://memory.psych.upenn.edu/RAM"
  license_text_excerpt: >-
    Users register, agree to research-only use, no redistribution and no attempt at re-identification.
  dua_required: true
  credentials_required: true
  registration_required: true
  purpose_limits: >-
    research only; no redistribution; no clinical or device use.
  consent_scope: >-
    epilepsy patients undergoing clinical intracranial monitoring consented to research recordings and stimulation under site IRB approval.
  redistribution: "not permitted without the data provider's agreement"
  withdrawal: "governed by the provider's withdrawal policy, which SC-WBD cannot honour without holding the data"
  privacy: >-
    de-identified intracranial recordings from a clinical epilepsy population; electrode locations are individually distinctive.
  retention: "not applicable: no bytes held"
  redistribution_class: none
  withdrawal_status: unknown
  privacy_class: deidentified
  contains_biometric: true
  may_release_weights: false
  may_release_examples: false
  purpose_limits_list: ["registration_required", "research_only", "no_redistribution"]
  safeguards: ["not_downloaded"]
  dua: "RAM data use agreement"

population:
  n_participants: "~250 patients (unverified: no access)"
  participant_ids: "unknown - no access"
  families: "unknown"
  sites: "~10 clinical centres"
  site_ids: []
