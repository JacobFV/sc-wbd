  device_ids: []
  sessions_per_participant: "multiple per patient"
  runs_per_session: unknown
  trials_per_run: unknown
  demographics: >-
    patients with medically refractory epilepsy undergoing invasive monitoring; electrode placement is dictated by clinical need, not by experimental design.
  selection_mechanism: >-
    clinical necessity determines who is recorded and where, so coverage is non-random with respect to anatomy - a structural confound, not a sampling nuisance.
  grouping_keys: ["participant", "site", "session"]
  min_subgroup_n: null

