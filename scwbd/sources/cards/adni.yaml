schema_version: scwbd-source-card/1.0.0

# =====================================================================
# UNAVAILABLE SOURCE.  Registered so the dataset register is complete and
# honest, NOT downloaded.  Appendix A lists this family as a candidate; the
# governance block below is the reason it is not in the training mixture.
# No bytes of this dataset exist on the local data root.
# =====================================================================
identity:
  id: adni
  name: "Alzheimer's Disease Neuroimaging Initiative (ADNI)"
  version: "unknown"              # no release is pinned because nothing was fetched
  release_date: "unknown"
  doi: "10.1212/01.wnl.0000271090.28148.24"
  citation: >-
    Jack CR Jr et al. (2008). The Alzheimer's Disease Neuroimaging Initiative (ADNI): MRI methods. J Magn Reson Imaging 27:685-691.
  source_url: "https://adni.loni.usc.edu/data-samples/access-data/"
  download_url: null
  download_method: "not attempted - see governance.unavailable_reason"
  retrieved_utc: null
  parent_dataset: null
  derived_from: null
  derivatives_included: []
  software: {}
  container_hash: unknown
  local_path: null
  file_manifest: null

governance:
  license_spdx: "DUA-ADNI"
  license_spdx_note: >-
    not an open licence: an application-reviewed Data Use Agreement. Routed as DUA-*, which the checkpoint policy must treat as unknown-and-unusable, never as permissive.
  status: unavailable
  unavailable_reason: >-
    access requires an application reviewed by the ADNI Data Sharing and Publications Committee and a signed Data Use Agreement via LONI/IDA. No application was submitted, so nothing was downloaded.
  license: "ADNI Data Use Agreement (application + signature required)"
  license_url: "https://adni.loni.usc.edu/wp-content/uploads/how_to_apply/ADNI_Data_Use_Agreement.pdf"
  license_text_excerpt: >-
    Investigators agree not to distribute the data, not to attempt re-identification, to acknowledge ADNI funding and to submit publications for review.
  dua_required: true
  credentials_required: true
  registration_required: true
  purpose_limits: >-
    Alzheimer's-related research; publication acknowledgement and review obligations; no redistribution.
  consent_scope: >-
    participants consented to research sharing under site IRB approval.
  redistribution: "not permitted without the data provider's agreement"
  withdrawal: "governed by the provider's withdrawal policy, which SC-WBD cannot honour without holding the data"
  privacy: >-
    de-identified longitudinal imaging, PET, CSF and cognitive data on a clinical cohort.
  retention: "not applicable: no bytes held"
  redistribution_class: none
  withdrawal_status: unknown
  privacy_class: deidentified
  contains_biometric: true
  may_release_weights: false
  may_release_examples: false
  purpose_limits_list: ["approved_application_only", "no_redistribution", "acknowledge_adni"]
  safeguards: ["not_downloaded"]
  dua: "ADNI Data Use Agreement"

population:
  n_participants: "~2000 across ADNI-1/GO/2/3 (unverified: no access)"
  participant_ids: "unknown - no access"
  families: "unknown"
