  devices: unknown
  device_ids: []
  sessions_per_participant: "longitudinal, up to ~10 visits"
  runs_per_session: unknown
  trials_per_run: unknown
  demographics: >-
    older adults (55-90) with normal cognition, mild cognitive impairment or Alzheimer's disease; enriched for disease by design.
  selection_mechanism: >-
    clinically recruited diagnostic groups; a disease cohort, not a general adult population.
  grouping_keys: ["participant", "site", "session"]
  min_subgroup_n: null

