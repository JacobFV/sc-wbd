  redistribution: "unrestricted (CC0)"
  redistribution_class: full
  withdrawal: "no withdrawal mechanism is published for this release"
  withdrawal_status: none_pending
  privacy: >-
    defaced T1w volumes; participant ids are pseudonymous (sub-xp101..110).
