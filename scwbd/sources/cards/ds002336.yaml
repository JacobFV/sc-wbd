    or her rights to the work worldwide under copyright law ... You can copy,
    modify, distribute and perform the work, even for commercial purposes, all
    without asking permission."
  dua_required: false
  credentials_required: false
  registration_required: false
  purpose_limits: >-
    none imposed by the licence. The acquisition was approved by the local
    ethics committee (see the dataset's own README and the Scientific Data
    paper); participants gave written informed consent.
  consent_scope: >-
    unknown at the record level - the consent documents are not distributed.
    Public release under CC0 by the data producers is the only evidence of
    consent to share, and it is evidence about the producers' judgement, not a
