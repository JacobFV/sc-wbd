    - sub-xp103
    - sub-xp104
    - sub-xp105
    - sub-xp106
    - sub-xp107
    - sub-xp108
    - sub-xp109
    - sub-xp110
  participants_with_signal_binaries:
    - sub-xp101
    - sub-xp102
    - sub-xp103
    - sub-xp104
    - sub-xp105
    - sub-xp106
    - sub-xp107
    - sub-xp108
    - sub-xp109
    - sub-xp110
  families: "none declared; participants treated as unrelated singletons"
  sites: 1
  site_ids: ["openneuro:ds002336:neurinfo_chu_pontchaillou_rennes"]
  devices: 2
  device_ids: ["BrainProducts_BrainCap_MR_64ch", "Siemens_Verio_3T"]
  sessions_per_participant: 1
  runs_per_session: "6 task types on disk (MIpost, MIpre, eegNF, eegfmriNF, fmriNF, motorloc); 54 EEG runs, 55 BOLD runs, 53 runs with BOTH arms"
  trials_per_run: >-
    block design, 20 s rest alternating with 20 s task: 8 blocks (motorloc),
    10 blocks (each NF run)
  demographics: >-
    healthy volunteers; age, sex and handedness are in participants.tsv. n = 10
    is too small for any subgroup claim and none is made.
  selection_mechanism: >-
    volunteers recruited for a neurofeedback study; no population sampling
    frame. Conclusions transfer to "healthy adults performing kinaesthetic
    motor imagery", not to a population.
  grouping_keys: ["participant"]
  min_subgroup_n: 10

# =====================================================================
# S_k  signal
# =====================================================================
signal:
  # Every modality is backed by files under the dataset root; the globs are
  # enforced by scwbd.sources.audit (A4). The BrainVision HEADER types all 64
  # channels 'eeg' and there is no separate EOG/ECG channel in this montage,
  # so no such modality is claimed.
  modality_evidence:
    eeg:  {globs: ["sub-*/eeg/*_eeg.vhdr"], channel_type: EEG}
    fmri: ["sub-*/func/*_bold.nii.gz"]
    mri:  ["sub-*/anat/*_T1w.nii.gz"]
  modalities: ["eeg", "fmri", "mri"]
  n_channels: 64
  channel_types: {eeg: 64}
  channel_names: >-
    extended 10-20 BrainCap MR labels (Fp1, Fp2, F3 ... FT9, FT10, Fpz, CPz),
    read from the .vhdr; listed per run in channels.tsv
  units: "V (SI, converted by MNE from the BrainVision resolution field)"
  # V is the SI unit of the EEG, which is the only channel set here that HAS
  # one; BOLD intensity is scanner-native and uncalibrated. Recorded as the
  # scalar the schema expects, with the qualification stated rather than
  # encoded in a dict the projection cannot read.
  si_units: V
  si_units_note: >-
    applies to the 64 EEG channels only. The BOLD runs carry arbitrary
    scanner-native intensity with no SI unit, and nothing in this release
    calibrates them.
  reference: >-
    FCz during acquisition (BrainCap MR); the raw files are distributed
    unreferenced-to-average and NO re-referencing is applied by the loader.
  dynamic_range: unknown
  si_dynamic_range: unknown
  saturation: unknown
  si_saturation: unknown
  quantization: unknown
  si_quantization: unknown
  bold_acquisition:
    scanner: "Siemens Verio 3T"
    sequence: "2D EPI (%SiemensSeq%_ep2d_bold), GRAPPA in-plane factor 2"
    repetition_time_s: 2.0
    echo_time_s: 0.023
    flip_angle_deg: 90
    slice_thickness_mm: 4
    phase_encoding_direction: "j-"
    slice_timing_present: true
    note: >-
      Read from the per-run BIDS sidecars, not from the paper. The loader
      (scwbd.sources.loaders.bids_bold) cross-checks RepetitionTime against the
      NIfTI pixdim[4] and refuses the run if they disagree by more than 1 ms.
  artefact_note: >-
    THE DOMINANT SIGNAL PROPERTY OF THIS SOURCE. EEG recorded inside a running
    MR sequence carries gradient and ballistocardiogram artefacts that are
    orders of magnitude larger than the neural signal. The RAW .eeg files are
    therefore NOT usable as a likelihood without artefact correction; the
    dataset ships derivatives/*/eeg_pp, the producers' own gradient- and
    pulse-corrected BrainVision triples, and those are the usable
    electrophysiology. Both are on disk and the card names both so that a
    reader cannot mistake one for the other.

# =====================================================================
# X_k  spatial support
# =====================================================================
spatial:
  kind: sensor
  kind_note: >-
    two supports, and the scalar names the electrophysiological one because
    that is the modality the observation head attaches to: a 64-channel scalp
    sensor array (EEG) and a 3-D voxel grid (BOLD, T1w). See spatial.supports.
  supports: ["sensor", "voxel"]
  frame: braincap_mr_template_montage
  frame_note: >-
    EEG: BrainCap MR NOMINAL montage - no subject-specific digitised electrode
    positions are distributed, so this is a template frame and not a measured
    one, and any lead field built on it inherits that uncertainty. BOLD/T1w
    live in scanner_anat_RAS, read per file from the NIfTI sform by the loader.
  units: m
  units_note: >-
    metres for the nominal EEG montage (the scalar, because that is the support
    `kind` names); the BOLD and T1w voxel grids are in millimetres, read per
    file from the NIfTI header.
  psf: unknown
  extent: "whole head (EEG); whole brain (BOLD, 4 mm slices)"
  n_elements: "64 EEG sensors; BOLD voxel grid per run (read from the NIfTI header, not assumed). 54 EEG runs and 55 BOLD runs on disk."
  coregistration_note: >-
    EEG and MRI are acquired in the same session on the same head, but NO
    EEG-to-MRI transform is distributed. Anyone building a lead field from this
    source is estimating that transform, and the estimate's uncertainty belongs
    in the ledger, not in a fixed matrix.

# =====================================================================
# T_k  temporal support
# =====================================================================
temporal:
  clock: ds002336.eeg_amp             # the fastest clock; see clocks_note
  clocks: ["ds002336.eeg_amp", "ds002336.mri_scanner"]
  clocks_note: >-
    TWO clocks, deliberately never merged. The EEG amplifier clock
    (5000 Hz, phase-locked to the scanner's 10 MHz reference via the
    SyncBox) and the scanner clock (TR = 2 s). The loaders return them as
    separate objects with different clock_id values
    ("eeg_amp:..." vs "mri_scanner:...") so a naive concatenation cannot
    typecheck. The scalar `clock` above names the fastest one because the
    typed projection takes a single id - it is NOT a claim that the two were
    merged.
  # `dt` and `sfreq_hz` are the FASTEST group, as a float, matching the
  # convention sleep-edfx set for a multirate source: the typed projection
  # needs one number and picking the fastest is the conservative choice for
  # anything that reasons about resolvable bandwidth. The full per-clock
  # picture is in the two `_by_clock` fields, which is where a reader must
  # look before combining the modalities.
  dt: 0.0002
  sfreq_hz: 5000.0
  dt_by_clock: {eeg_amp: 0.0002, mri_scanner: 2.0}
  sfreq_hz_by_clock: {eeg_amp: 5000.0, mri_scanner: 0.5}
  secondary_sfreq_hz: 0.5
  sfreq_note: >-
    Measured from the .vhdr and the BIDS sidecars on disk, not read off the
    paper. The ratio is 10,000:1 - the widest temporal non-nesting in the
    register, and a real instance of thesis 2.6 rather than a declared one.
  integration_window: "0.0002 s (EEG sample); ~0.023 s TE with 2 s volume coverage (BOLD)"
  group_delay: unknown
  jitter_sd: unknown
  event_clock: >-
    stimulus/NF events are in the per-run events.tsv on the scanner clock;
    the EEG .vmrk carries the scanner volume triggers, which is what relates
    the two clocks. That relation is RECORDED, not assumed.
  offset_drift: unknown
  duration_measured_s:
    note: >-
      Read from the .vhdr headers of sub-xp101 (the first complete
      participant): motorloc 336.9 s, fmriNF 488.2 s, eegfmriNF 448.9 s,
      eegNF 525.4 s. Other participants differ by a few seconds; per-run
      durations are re-derived by reports/sources/inventory.md rather than
      assumed constant.

# =====================================================================
# C_k  calibration
# =====================================================================
calibration:
  frames: ["braincap_mr_template_montage", "scanner_anat_RAS"]
  fiducials: "not distributed"
  transforms: "none distributed (no EEG-to-MRI trans, no fieldmap-based unwarp)"
  calibration_points: 0
  residuals: unknown
  device_pose: "not applicable (EEG cap) / scanner sform (MRI)"
  raw_metadata: "BrainVision .vhdr/.vmrk, BIDS sidecars, participants.tsv, channels.tsv"
  head_model: "none distributed"
  electrode_positions: "nominal montage only; no digitisation"

# =====================================================================
# O_k  observation operator
# =====================================================================
observation:
  operator: >-
    EEG: a linear scalp projection of cortical current, with an UNKNOWN lead
    field (no digitised electrodes, no head model, no trans). BOLD: a
    haemodynamic response convolved with neural activity, sampled on the
    scanner grid at 0.5 Hz - a nonlinear, slow, spatially-smoothed operator
    with its own unknown parameters.
  operator_status: "unresolved for both modalities"
  noise_model: >-
    EEG: not estimated here; the artefact floor inside the scanner dominates
    any resting noise covariance computed from raw files. BOLD: not estimated.
  forward_available: false

# =====================================================================
# U_k  intervention
# =====================================================================
intervention: null   # neurofeedback is a closed loop on the participant's own
                     # signal, not an exogenous manipulation of brain state.
                     # Recording it as an intervention would license causal
                     # claims the design does not support.

# =====================================================================
# M_k  missingness
# =====================================================================
missingness:
  planned: >-
    The NF-score .mat derivatives and the QA .tiff figures were deliberately
    not fetched. Everything else in the raw tree is on disk.
  unplanned: "raw EEG present for 10, BOLD for 10, and both for 10 of 10 participants. AT RUN LEVEL the pairing is incomplete: 53 of 56 (subject, task) runs have both arms; 1 are EEG-only (sub-xp102/eegNF) and 2 are BOLD-only (sub-xp109/MIpost, sub-xp109/MIpre). An unpaired run is excluded from cross-modal terms rather than half-imputed; it remains usable as a single-modality record."
  artifact_rejection: >-
    none applied by us. The producers' eeg_pp derivatives have had gradient and
    pulse artefacts removed by their pipeline; the parameters of that pipeline
    are described in the paper and are not re-derivable from the files.
  dropout: unknown
  attrition: unknown
  policy: "absent runs are excluded from likelihood terms; never imputed (rule 1)"
  mechanism: mar
  mechanism_note: "release-level omission, not participant behaviour"
  handling: drop_episode

# =====================================================================
# L_k  ledger
# =====================================================================
ledger:
  variance:
    measurement: unknown          # the in-scanner artefact floor is not published for this release
    session: unknown
    parameter: unknown
    model: unknown
    numerical: 0.0
  bias_interval: unknown
  bias_status: unknown
  bias_bound_justification: >-
    The dominant systematic error is residual gradient/ballistocardiogram
    artefact in the EEG and haemodynamic-response mis-specification in the
    BOLD. Neither is bounded for this release, and writing an interval we did
    not measure would be worse than writing unknown. `unknown` here disables
    every gradient path that requires the ledger.
  model_discrepancy: null
  validity_domain:
    population: "healthy adults, n = 10, one site"
    state: "supine, eyes open, performing right-hand kinaesthetic motor imagery"
    frequency_band_hz: [0.0, 2500.0]
    spatial_scale: "scalp sensor and 4 mm voxel; no source scale without a forward operator"

# =====================================================================
# A_k  gradient permission
# =====================================================================
gradient_permission:
  allow:
    - target: dynamics.motor_cortex.imagery_response
      scales: ["parcel"]
      requires: ["temporal.sfreq_hz", "signal.si_units", "ledger.bias_status"]
    - target: observe.bold.haemodynamic_response
      scales: ["voxel"]
      requires: ["temporal.sfreq_hz", "signal.bold_acquisition"]
    - target: transforms.clock_graph.eeg_to_scanner
      scales: ["clock"]
      requires: ["temporal.event_clock"]
  frozen:
    - anatomy.connectome_prior
    - observe.eeg.lead_field        # no digitised electrodes and no head model
  forbid:
    - infer.treatment_efficacy      # neurofeedback outcome is not an SC-WBD claim
    - intervene.optimize_protocol
  evaluation_only: false

# =====================================================================
# R_k  role and split policy
# =====================================================================
role: likelihood

split_policy:
  grouping_keys: ["participant"]
  grouping_note: >-
    All runs and both modalities of a participant stay in one fold. The
    EEG and the BOLD of one run are the SAME datum observed twice; splitting
    them across folds would put a subject's own haemodynamics in the test set
    against their own electrophysiology in train (R10).
  temporal_holdout: >-
    available within participant: the protocol orders the runs
    motorloc -> MIpre -> three NF runs (randomised order) -> MIpost. The NF
    randomisation is not distributed, so the usable time axis is
    "motorloc and MIpre before the NF runs before MIpost", which is enough for
    the pre/post motor-imagery contrast and not enough to order the NF runs.
  temporal_holdout_spec: null
  stimulus_holdout: >-
    the manipulated variable is the NF feedback modality (eeg / fmri / both).
    Holding out one feedback condition is the discriminating test for a model
    that claims the feedback loop changes the dynamics rather than the report.
  site_holdout: "not available: one site, one scanner, one amplifier"
  leakage_barrier: parent_lineage
  role_locked: true
  stimuli_shared_across_folds: true
  notes: >-
    THE PAIRING IS THE POINT. This is the only source in the register where
    electrophysiology and haemodynamics are measured on the same subject at the
    same time, which is what body.tex 6.4 calls a fully paired episode. It is
    also the only source that can falsify a cross-modal consistency claim
    rather than merely illustrate one, because a model that fits the EEG and
    the BOLD of the same 20 s block with incompatible latent states is caught
    by construction. XP2 (ds002338, same producers, 18 further participants) is
    the natural replication set and is NOT on disk.
