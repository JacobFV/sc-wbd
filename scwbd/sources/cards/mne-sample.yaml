schema_version: scwbd-source-card/1.0.0

# =====================================================================
# I_k  identity and lineage
# =====================================================================
identity:
  id: mne-sample
  name: "MNE-Python sample dataset (Neuromag Vectorview, auditory/visual)"
  version: "processed-v6"
  release_date: "unknown"          # the archive carries version.txt = 0.12; no release date is published
  doi: "unknown"                   # the sample data has no DOI of its own
  citation: >-
    Gramfort A et al. (2013). MEG and EEG data analysis with MNE-Python.
    Frontiers in Neuroscience 7:267. The sample dataset is distributed with
    MNE-Python as MNE-sample-data-processed.tar.gz.
  source_url: "https://mne.tools/stable/documentation/datasets.html#sample"
  download_url: "https://osf.io/download/86qa2?version=6"
  download_method: >-
    mne.datasets.sample.data_path(), which verifies the archive against the
    md5 registered in mne.datasets.config: md5:e8f30c4516abdc12a0c08e6bae57409c.
    The OSF file version (6) is the pin, recorded here as version
    'processed-v6'; the unpacked tree additionally carries version.txt = 0.12.
  retrieved_utc: "2026-08-06T06:22:32+00:00"
  parent_dataset: null
  derived_from: null
  subset_note: "complete archive as distributed (raw, evoked, covariance, BEM, source spaces, forward solutions, FreeSurfer subjects sample and fsaverage)"
  derivatives_included:
    - "MEG/sample/sample_audvis-meg-eeg-oct-6-fwd.fif (precomputed forward solution, 366 x 22494)"
    - "MEG/sample/sample_audvis_raw-trans.fif (head <-> MRI transform)"
    - "subjects/sample/bem/*-bem-sol.fif (BEM solutions)"
    - "MEG/sample/ernoise-cov.fif (empty-room noise covariance)"
  derivative_note: >-
    This dataset is in the register PRECISELY because it ships derivatives:
    the forward solution and BEM are an independent implementation against
    which agent F's lead field can be checked. They are therefore
    calibration artefacts, not biological supervision - see role.
  software:
    acquisition: "Elekta Neuromag Vectorview 306 + 60-channel EEG; FreeSurfer reconstruction shipped"
    reader: "mne.io.read_raw_fif via scwbd.sources.loaders.mne_datasets"
    fetch: "scwbd.sources.download.MneDatasetFetcher (pooch md5 verification) + our own sha256 manifest"
  container_hash: unknown
  archive_md5: "e8f30c4516abdc12a0c08e6bae57409c"
  local_path: "/home/brandonin/Documents/integrated-whole-brain-modeling-across-modalities-scales-and-dynamics/data/mne-sample/processed-v6"
  file_manifest:
