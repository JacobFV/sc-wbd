# =====================================================================
identity:
  id: tuh-eeg
  name: "Temple University Hospital EEG Corpus (TUEG)"
  version: "unknown"              # no release is pinned because nothing was fetched
  release_date: "unknown"
  doi: "10.3389/fnins.2016.00196"
  citation: >-
    Obeid I, Picone J (2016). The Temple University Hospital EEG Data Corpus. Frontiers in Neuroscience 10:196.
  source_url: "https://isip.piconepress.com/projects/nedc/html/tuh_eeg/"
  download_url: null
  download_method: "not attempted - see governance.unavailable_reason"
  retrieved_utc: null
  parent_dataset: null
  derived_from: null
  derivatives_included: []
  software: {}
  container_hash: unknown
  local_path: null
  file_manifest: null

governance:
  license_spdx: "DUA-TUH-EEG"
  status: unavailable
  unavailable_reason: >-
    download requires a signed data use agreement and issued rsync credentials from the Neural Engineering Data Consortium. No agreement was signed and no credentials were requested, so nothing was downloaded.
  license: "TUH EEG Corpus Data Use Agreement (registration + signed DUA)"
  license_url: "https://isip.piconepress.com/projects/nedc/html/tuh_eeg/"
  license_text_excerpt: >-
    Users must register, agree not to redistribute the data or attempt re-identification, and must cite the corpus.
  dua_required: true
  credentials_required: true
  registration_required: true
  purpose_limits: >-
    research use only; no redistribution; citation required.
  consent_scope: >-
    clinical EEG collected in the course of care and released under an IRB-approved de-identification protocol; individual consent for research reuse is waived rather than obtained.
  redistribution: "not permitted without the data provider's agreement"
  withdrawal: "governed by the provider's withdrawal policy, which SC-WBD cannot honour without holding the data"
  privacy: >-
    de-identified clinical EEG with associated clinical reports; clinical text carries residual re-identification risk.
  retention: "not applicable: no bytes held"
  redistribution_class: none
  withdrawal_status: unknown
  privacy_class: deidentified
  contains_biometric: true
  may_release_weights: false
  may_release_examples: false
  purpose_limits_list: ["signed_dua_required", "no_redistribution", "research_only"]
  safeguards: ["not_downloaded"]
  dua: "TUH EEG Corpus Data Use Agreement"

population:
  n_participants: "~15000 patients across >30000 sessions (unverified: no access)"
  participant_ids: "unknown - no access"
  families: "unknown; repeat visits by the same patient are common and MUST be grouped by patient"
  sites: 1
  site_ids: []
  devices: unknown
  device_ids: []
  sessions_per_participant: unknown
  runs_per_session: unknown
  trials_per_run: unknown
  demographics: >-
    clinical population of a single US hospital; heavily enriched for epilepsy and other neurological disease. Not a general adult brain.
  selection_mechanism: >-
    consecutive clinical referrals; selection is by clinical indication, which is exactly the confound a general-brain model must not absorb.
  grouping_keys: ["participant", "session", "site"]
  min_subgroup_n: null

