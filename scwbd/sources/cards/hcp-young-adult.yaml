governance:
  license_spdx: "DUA-HCP-OpenAccess"
  license_spdx_note: >-
    click-through data use terms, not an SPDX licence.
  status: unavailable
  unavailable_reason: >-
    the Open Access tier requires each user to accept the WU-Minn HCP Open Access Data Use Terms through a ConnectomeDB account, and the Restricted tier (family structure, twin zygosity, age in years) requires a separate signed agreement. No account was created and no terms were accepted, so nothing was downloaded. NOTE: HCP is a twin and sibling study - without the Restricted tier the family structure needed for a leakage-safe split is not even obtainable, which is a second, independent reason not to use it here (R10).
  license: "WU-Minn HCP Open Access Data Use Terms (click-through agreement)"
  license_url: "https://www.humanconnectome.org/study/hcp-young-adult/document/wu-minn-hcp-consortium-open-access-data-use-terms"
  license_text_excerpt: >-
    Users agree not to attempt to identify participants, to cite the HCP, and to abide by restrictions on sensitive family-structure variables.
  dua_required: true
  credentials_required: true
  registration_required: true
  purpose_limits: >-
    research use with mandatory citation; no re-identification; restricted variables may not be published in a way that permits identification.
  consent_scope: >-
    participants consented to broad sharing with tiered access controls on family and sensitive variables.
  redistribution: "not permitted without the data provider's agreement"
  withdrawal: "governed by the provider's withdrawal policy, which SC-WBD cannot honour without holding the data"
  privacy: >-
    de-identified imaging with restricted access to family structure, exact age and clinical variables.
  retention: "not applicable: no bytes held"
  redistribution_class: none
  withdrawal_status: unknown
  privacy_class: pseudonymized
  contains_biometric: true
  may_release_weights: false
  may_release_examples: false
  purpose_limits_list: ["accept_data_use_terms", "no_reidentification", "cite_hcp"]
  safeguards: ["not_downloaded"]
  dua: "WU-Minn HCP Open Access Data Use Terms + Restricted Data Use Terms"

