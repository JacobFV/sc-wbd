  retrieved_utc: "2026-08-06T07:22:35+00:00"
  parent_dataset: null
  derived_from: null
  subset_note: >-
    Complete BIDS metadata (dataset_description, participants, channels,
    electrodes, coordsystem, events, sidecars) for all 13 participants, plus
    signal binaries for a pinned subject subset only - the full release is
    1021 GiB (verified 2026-08-06: 3144 objects, 1096522006089 bytes under
    s3://openneuro.org/ds004024/). The exact subject subset is recorded in
    population.participants_with_signal_binaries.

    The subsetting is by TASK as well as by subject, and that matters for what
    can be claimed. For each pinned subject we fetched, from ses-async14ms
