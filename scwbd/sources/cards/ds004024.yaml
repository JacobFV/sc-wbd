    Cortico-cortical paired associative stimulation (ccPAS) with bi-focal
    MRI-navigated TMS-EEG of left and right M1.
  source_url: "https://openneuro.org/datasets/ds004024/versions/1.0.0"
  download_url: "s3://openneuro.org/ds004024/"
  download_method: >-
    anonymous S3 mirror of the OpenNeuro dataset. The mirror tracks the dataset
    head, which for ds000117 turned out to serve a mutable draft rather than
    any published snapshot - an Appendix B rejection condition. That hazard was
    therefore tested here rather than assumed away.

    VERIFIED 2026-08-06: the S3 head is byte-identical to pinned snapshot 1.0.0.
    sha256 of dataset_description.json, README, CHANGES and participants.tsv
    fetched from
    https://openneuro.org/crn/datasets/ds004024/snapshots/1.0.0/files/ match the
    bytes on disk exactly (b552448c44dc85e1..., 69c01ab715c3bc3e...,
    7740cf8d7538229c..., 58276a426b075c0d... respectively). Version 1.0.0 is
    also the only release (CHANGES: '1.0.0 2022-02-14 - Initial upload'), so
    head and snapshot coincide. Every fetched object is additionally pinned by
    sha256 in the local manifest, so a later upstream edit is detectable rather
