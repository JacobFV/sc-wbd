    - sub-CON031
  participants_with_signal_binaries:
    - sub-CON001
    - sub-CON006
  sessions_present:
    - ses-async14ms
    - ses-async4ms
    - ses-async9ms
    - ses-mri
  families: "none declared; participants treated as unrelated singletons"
  sites: 1
  site_ids: ["openneuro:ds004024:shirley_ryan_abilitylab"]
  devices: 1
  device_ids: ["BrainProducts_64ch_DC + MRI-navigated TMS"]
  sessions_per_participant: >-
    up to 4 (ses-async4ms, ses-async9ms, ses-async14ms, ses-mri), at least one
