    13 async14ms, 11 async4ms, 7 async9ms and 10 mri sessions.
  runs_per_session: >-
    up to 12 spTMS runs (01-06 at 100% rMT, 07-12 at 110% rMT), 1 ccPAS run,
    3-4 resting-state runs
  trials_per_run: "spTMS runs contain single pulses; the events.tsv lists 'Stimulus/A' and 'Out/A' markers per pulse"
  demographics: >-
    unknown - participants.tsv carries age, sex and hand columns but every
    value is 'n/a'. No subgroup calibration claim is evaluable on this source.
  selection_mechanism: >-
    healthy control volunteers ('CON' prefix) recruited for a ccPAS
    connectivity study; inclusion criteria are not distributed with the data.
  grouping_keys: ["participant", "session", "run"]
  min_subgroup_n: null

# =====================================================================
# S_k(signal)  native signal and units
# =====================================================================
signal:
  # CORRECTED 2026-08-06 (Ada). This list previously read
  #   [eeg, eog, emg, ecg, mri, fmri, dwi]
  # and the registry entry declared modalities ("eeg","tms","mri","fmri").
  # NEITHER fmri NOR dwi is on disk: the fetched subset holds two T1w volumes
  # and nothing else from ses-mri. The upstream release does have BOLD and
  # diffusion; we did not fetch them. A card that keeps them in
  # signal.modalities reads as coverage we do not have, and
  # scwbd.release.datasets.link_sources_to_datasets computes a checkpoint's
  # modality set from exactly this field - so the phantom entries would have
  # been reported as haemodynamic content of a checkpoint that never saw any.
  # What was NOT fetched is recorded below rather than deleted.
  modalities_upstream_not_fetched: [fmri, dwi]
  modality_evidence:
    eeg: {globs: ["sub-*/ses-*/eeg/*_channels.tsv"], channel_type: EEG}
    eog: {globs: ["sub-*/ses-*/eeg/*_channels.tsv"], channel_type: EOG}
    emg: {globs: ["sub-*/ses-*/eeg/*_channels.tsv"], channel_type: EMG}
    ecg: {globs: ["sub-*/ses-*/eeg/*_channels.tsv"], channel_type: ECG}
    mri: ["sub-*/ses-mri/anat/*_T1w.nii.gz"]
  modalities: ["eeg", "eog", "emg", "ecg", "mri"]
  n_channels: 69
  channel_types: {eeg: 64, eog: 2, emg: 2, ecg: 1}
  channel_names: "extended 10/20 labels (Fp1..O2 + EOG/EMG/ECG), listed per run in channels.tsv"
  units: "V (SI, converted by MNE from the BrainVision physical dimension uV)"
  file_physical_dimension: "µV with a declared resolution of 0.1 µV; binary format IEEE_FLOAT_32"
  reference: >-
    right mastoid, recorded in DC mode (stated in dataset_description.json).
    Note the per-run sidecar field EEGReference is literally 'n/a', so the two
    metadata sources disagree in specificity; the dataset-level statement is
    used and the discrepancy is recorded here rather than hidden.
  dynamic_range: "not declared as a rail: samples are IEEE float32, so the amplifier range is not recoverable from the file"
  saturation: "unknown - no saturation or clipping flags are distributed; TMS artefact routinely saturates the front end in the first milliseconds after a pulse"
  quantization: "0.1 uV declared resolution in the BrainVision header (values stored as float32)"
  prefilter_header: "low_cutoff 0.0 Hz (DC), high_cutoff 10000 Hz (channels.tsv)"
  name: ds004024.scalp_potential
  si_units: V
  si_dynamic_range: null
  si_saturation: null
  si_quantization: 1.0e-7
  irreversible_aggregation: false
  line_frequency_hz: 60.0

# =====================================================================
# S_k  spatial support
# =====================================================================
spatial:
  kind: sensor
  frame: CapTrak_m
  units: m
  psf: >-
    unknown as a numeric kernel: no lead field ships with the release. However
    the ingredients for computing one *do* exist here (digitised electrodes in
    CapTrak metres with NAS/LPA/RPA landmarks, plus a subject T1w), so the
    lead-field gradient path is enabled only once a computed forward operator
    is registered by agent F - it is not enabled by this card alone.
  extent: null
  n_elements: 69
  positions_are_digitised: true
  positions_source: "per-session electrodes.tsv in CapTrak coordinates, units metres, with anatomical landmarks in coordsystem.json"

# =====================================================================
# T_k  temporal support and clocks
# =====================================================================
temporal:
  clock: ds004024.brainvision_amp
  dt: 5.0e-5
  sfreq_hz: 20000.0
  integration_window: 0.0
  group_delay: 0.0
  group_delay_justification: >-
    DC-mode recording with a 10 kHz declared high cutoff and no software
    filters ("SoftwareFilters": "n/a"); the analogue anti-alias delay at
    20 kHz is below one sample and is declared as 0 with that justification.
  jitter_sd: unknown
  event_clock: ds004024.brainvision_amp
  event_clock_relation: >-
    events.tsv carries an explicit integer 'sample' column on the amplifier
    clock, so TMS pulse onsets map to samples exactly. The TMS device's own
    trigger clock relative to the amplifier is NOT documented; the residual
    trigger jitter is the 'unknown' above and it bounds any latency claim
    finer than one sample.
  offset_drift: unknown
  record_duration_s: "402.2 s for sub-CON001 spTMS run-01; per-run values in the sidecars"

# =====================================================================
# C_k  coordinates and calibration
# =====================================================================
calibration:
  id: ds004024.calibration
  frames: ["CapTrak_m", "subject_T1w_voxel", "subject_scanner_RAS"]
  fiducials:
    NAS: [-3.6088749766349792e-09, 0.09829775989055634, -1.862645149230957e-09]
    LPA: [-0.06977154314517975, 2.3283064365386963e-09, 0.0]
    RPA: [0.07345140725374222, -1.862645149230957e-09, 0.0]
    note: "sub-CON001 values, metres, CapTrak; each session ships its own coordsystem.json"
  transforms: >-
    CapTrak -> T1w is NOT distributed as a matrix. It is computable from the
    three landmarks plus the T1w image, and until agent F computes and
    registers it, the head<->MRI edge of the frame graph is missing for this
    source.
  calibration_points: "3 anatomical landmarks (NAS, LPA, RPA) + 69 digitised electrode positions per session"
  residuals: unknown
  device_pose: >-
    the TMS coil pose was MRI-navigated during acquisition but the per-pulse
    coil position/orientation log is NOT distributed. This is the single most
    important missing field for the perturbation benchmark and it disables the
    E-field gradient path outright.
  raw_metadata: "BIDS sidecars: *_eeg.json, *_channels.tsv, *_electrodes.tsv, *_coordsystem.json, *_events.tsv"
  electrode_positions: "digitised, per session, CapTrak metres (electrodes.tsv)"
  head_model: unknown
  amplifier_gain_calibration: unknown

# =====================================================================
# O_k  observation model
# =====================================================================
observation:
  name: ds004024.tms_eeg
  forward_physics: >-
    quasi-static EEG forward problem; the digitised electrodes and subject T1w
    make an individual BEM/FEM lead field computable, but no forward operator
    ships with the release.
  observed_variables: ["scalp potential at 64 electrodes (20 kHz, DC-coupled)", "EOG", "submental/FDI EMG (MEP amplitude)", "ECG", "T1w structural", "resting BOLD (subset)"]
  preprocessing: "none by the provider beyond BIDS conversion; the loader applies no filter, no artefact rejection and no downsampling"
  preprocessing_steps: []
  likelihood_kind: generative
  calibration_status: uncalibrated
  leakage_checked: true
  target_ports: ["eeg.sensor_64ch", "motor.mep_fdi"]
  labels_leak_risk: >-
    none for the perturbation itself: the pulse time is a device trigger, not
    a quantity derived from the EEG.

# =====================================================================
# U_k  intervention model
# =====================================================================
intervention:
  name: ds004024.tms
  modality: tms
  waveform: "biphasic single pulse (spTMS) and paired-pulse cortico-cortical PAS (ccPAS) with 4, 9 or 14 ms inter-pulse asynchrony"
  targets: "left and right primary motor cortex (M1), first dorsal interosseous representation, MRI-navigated"
  dose:
    sptms_intensity_pct_rmt_low: 100.0
    sptms_intensity_pct_rmt_high: 110.0
    ccpas_asynchrony_ms_4: 4.0
    ccpas_asynchrony_ms_9: 9.0
    ccpas_asynchrony_ms_14: 14.0
  dose_units:
    sptms_intensity_pct_rmt_low: dimensionless
    sptms_intensity_pct_rmt_high: dimensionless
    ccpas_asynchrony_ms_4: s
    ccpas_asynchrony_ms_9: s
    ccpas_asynchrony_ms_14: s
  dose_note: >-
    Intensity is expressed relative to each participant's resting motor
    threshold, and the per-participant rMT in stimulator output units is NOT
    distributed. The absolute dose in A/m^2 or V/m at the cortex is therefore
    unknown, which is why the E-field gradient path is disabled.
  pose_frame: unknown            # no per-pulse coil pose log is distributed
  field_solver: null             # no E-field model ships with the release
  target_ports: ["motor.m1_left", "motor.m1_right"]
  sham: "none - the design contrasts asynchronies and pre/post timing, not active vs sham"
  randomized: false
  dose_independently_calibrated: false
  manipulated_variables: ["TMS pulse timing", "hemisphere targeted", "inter-pulse asynchrony", "pre/post ccPAS block"]
  observed_only_variables: ["EEG", "EMG/MEP", "ECG", "resting BOLD", "T1w"]

# =====================================================================
# M_k  missingness and censoring
# =====================================================================
missingness:
  planned: >-
    Signal binaries fetched for a pinned subject AND task subset only (see
    identity.subset_note). Two different things are folded together in this
    release and must not be confused:

    Upstream gaps (properties of the study): the 110% rMT runs (07-12) were not
    collected in all sessions by the original investigators; resting-Control is
    missing in some sessions; not every participant attended every asynchrony
    session (13 ses-async14ms, 11 ses-async4ms, 7 ses-async9ms, 10 ses-mri on
    disk, counted 2026-08-06).

    Our fetch gaps (properties of this snapshot, not of the study): the ccPAS
    induction run, spTMS runs 07-12, resting runs 02-04 and the 4 ms / 9 ms
    sessions were not downloaded for any subject.

    What the fetched bytes DO support: per dataset_description.json, spTMS runs
    01-06 are the complete 100% rMT probe design - spTMS-Before, spTMS-After10
    and spTMS-After60, crossed with left/right M1 - and are collected in all
    sessions.

    CORRECTED 2026-08-06 (agent Galvani, by loading the bytes rather than
    reading this table): the pre/post ccPAS effect contrast is NOT supported,
    because the design's per-run LABELS are not distributed. The runs are on
    disk; which run is "Before" and which is "After10"/"After60" is not. Four
    independent places where that label could have lived are all empty:
      - the per-run *_eeg.json sidecars carry TaskName "spTMS" and nothing else
        that distinguishes runs;
      - *_scans.tsv has an acq_time column whose value is "n/a" in every row;
      - the .vmrk marker files were rewritten by pybv 0.6.0 with an EMPTY date
        field, so mne reports meas_date None and the wall clock is gone;
      - events.tsv contains only Stimulus/A and Out/A markers, structurally
        identical across all six runs.
    The only remaining discriminator is the run INDEX, and mapping index to
    design cell is a convention, not a record. It is also measurably imperfect:
    the hemisphere factor, which IS recoverable from the lateralised MEP,
    alternates left/right exactly as the convention predicts in 11 of 12 loaded
    runs and contradicts it in one (sub-CON006 run-06). Inferring the timepoint
    from the MEP amplitude and then testing a ccPAS effect on that amplitude
    would be circular. The pre/post contrast is therefore recorded as
    UNAVAILABLE on this snapshot, and fetching more subjects does not fix it -
    the missing labels are a property of the upstream release's metadata, not
    of our subject subset.

    What they do NOT support: (a) the ccPAS induction stimulus itself is absent,
    so nothing here constrains a model of the paired-pulse induction; (b) with
    only 14 ms fetched there is no asynchrony contrast, so the timing-dependent
    plasticity test named in split_policy.stimulus_holdout CANNOT be run on this
    snapshot; (c) intervention.dose declares 110% rMT but no 110% rMT bytes were
    fetched, so any intensity contrast is unevaluable here.
  unplanned: >-
    EEG binaries fetched for 2 of 13 participants (sub-CON001, sub-CON006);
    BIDS metadata (channels, electrodes, events, sidecars) is present for all
    participants. Unfetched runs are excluded, never interpolated.

    VERIFIED BY LOADING 2026-08-06 (agent Galvani), not by directory listing:
    all 12 spTMS runs (2 participants x runs 01-06) open with
    mne.io.read_raw_brainvision and yield real signal. All 36 associated
    .eeg/.vhdr/.vmrk files match their manifest sha256 and byte length exactly.
    This specifically closes the sub-CON006 hazard in known_issues.md ISSUE-003,
    where interrupted multipart temp files had previously made that subject look
    populated while holding zero recoverable signal: no temp files remain, and
    the binaries load and produce lateralised MEPs.

    Measured per run: 20000 Hz, 69 channels (64 EEG + 2 EOG + 2 EMG + 1 ECG per
    channels.tsv - note the BrainVision header itself carries no channel types,
    so a reader that skips channels.tsv will mistype all 69 as EEG), 402-418 s
    duration, 80 TMS pulses at a 5.000 s inter-pulse interval (sd 0.000 s).
    The single exception is sub-CON006 run-05: 82 pulses, ISI max 8.322 s,
    sd 0.367 s. Electrodes: 64 of 69 rows carry numeric CapTrak coordinates
    (median radius 0.110 m); the 5 peripheral channels carry no position and are
    recorded as absent rather than zero.
  artifact_rejection: >-
    none applied by the provider or here; the TMS pulse artefact is present in
    the raw data and must be handled by the consumer with a declared operator.

    MEASURED 2026-08-06 (agent Galvani, scwbd.sources.perturbation.ds004024.
    measure_saturation, 40 pulses per run over 6 runs): the amplifier is driven
    to a rail of 0.44-0.53 V, i.e. roughly 5000x a physiological scalp potential,
    and the samples in hard contact with that rail end by 0.30 ms (median) and
    0.35 ms (max) after the pulse. signal.saturation was previously "unknown";
    the rail is not declarable from the file format - the samples are IEEE
    float32, so no clipping value is recoverable from the header - but it is
    measurable from the data, and now has been.

    This 0.35 ms figure bounds HARD SATURATION ONLY. It does NOT bound the
    slower decay, amplifier recovery, muscle and recharge artefacts, and it must
    not be quoted as an artefact-free horizon. The loader's default exclusion
    window therefore remains the 10 ms declared in ledger.validity_domain, which
    is wider than the measurement, and the measured saturation is carried
    alongside it rather than replacing it. A defensible bound on the slow decay
    was NOT established here: two candidate recovery metrics were discarded
    because they read identically (the window edge) for all 12 runs and so could
    not discriminate.
  dropout: "participants attended different numbers of asynchrony sessions (13/11/7 for 14/4/9 ms)"
  attrition: "session attendance is unbalanced by design and by drop-out; the release does not distinguish the two"
  policy: >-
    Runs that were not fetched are absent, not zero. A participant with no
    ses-async9ms contributes no 9 ms evidence and is never imputed from the
    4 ms or 14 ms condition.
  mechanism: planned
  handling: drop_episode
  post_outcome_selection: false
  censoring_correlated_with_state: false

  # -- why 'planned' and not 'mnar' -------------------------------------
  # This card previously declared mechanism: mnar with handling: drop_episode.
  # scwbd.schema.Missingness rejects that pair, and it is RIGHT to: if data are
  # genuinely missing-not-at-random, dropping the missing episodes does not fix
  # the bias, it embeds it. The constraint was not weakened to make this card
  # validate; the card was wrong to use one field for two different processes.
  #
  # Two distinct mechanisms are in play, and only one of them governs the
  # analysis this card licenses:
  #
  #   1. OUR SUBSET (dominant, and what 'mechanism' now refers to): the choice
  #      of 2 subjects x ses-async14ms x spTMS runs 01-06 + rest run-01 is
  #      deterministic, made by us, fully enumerated in identity.subset_note,
  #      and independent of anything measured. That is 'planned' in the exact
  #      sense of the schema literal, and drop_episode is the correct handling:
  #      what we did not fetch is absent, never imputed.
  #
  #   2. UPSTREAM ATTENDANCE (residual, NOT captured by the field above):
  #      participants attended different numbers of asynchrony sessions
  #      (13/11/7 for 14/4/9 ms) and the release does not distinguish design
  #      from drop-out. If attendance depended on how a participant responded
  #      to stimulation, that component IS MNAR and dropping it WOULD bias any
  #      estimate pooled across participants.
  #
  # The residual MNAR risk in (2) is not neutralised, it is confined. It can
  # only bias a quantity that pools across participants, and split_policy.notes
  # already forbids exactly that: the Fisher-rank claim must be reported per
  # participant and never pooled. Per-participant reporting is therefore not a
  # stylistic preference on this source - it is the reason the residual MNAR
  # component cannot reach a published number. Any future consumer that pools
  # across participants here must first re-derive mechanism as 'mnar' and
  # supply an admissible handling (missingness model, IPW, or design factor);
  # it may not reuse this 'planned' declaration.
  #
  # See reports/known_issues.md ISSUE-005: one Missingness object per card
  # cannot express two co-occurring mechanisms, which is what forced the choice.
  upstream_attendance_mechanism: unknown
  upstream_attendance_mnar_risk: >-
    unquantified. Session attendance is unbalanced by design and by drop-out and
    the release does not distinguish the two, so the MNAR component cannot be
    bounded from the distributed data. It is confined by the per-participant
    reporting rule in split_policy.notes rather than corrected.

# =====================================================================
# B_k, V_k, Delta_k  uncertainty ledger
# =====================================================================
ledger:
  variance:
    measurement: 1.0e-14          # V^2; (0.1 uV resolution)^2 as a floor, not an instrument spec
    session: unknown              # multiple sessions exist per subject but session variance is not estimated here
    parameter: unknown
    model: unknown
    numerical: 0.0
  bias_interval: [-1.0e-3, 1.0e-3]
  bias_status: prior_specified_sensitivity
  bias_bound_justification: >-
    The dominant systematic error is the TMS-evoked artefact (decay,
    amplifier recovery, muscle and recharge artefacts) in the first tens of
    milliseconds after each pulse. Its magnitude is state and coil dependent
    and no bound is published for this dataset, so the interval is a prior
    specification for sensitivity analysis, NOT a measured envelope.
  model_discrepancy: null
  validity_domain:
    population: "healthy adult volunteers, demographics undisclosed"
    state: "awake, seated, eyes open, at rest between pulses"
    frequency_band_hz: [0.0, 10000.0]
    spatial_scale: "scalp sensor; source scale only after a registered forward operator"
    post_pulse_window_s: "evidence within ~0.01 s of a pulse is artefact-dominated and outside the validity domain"

# =====================================================================
# A_k  gradient permission
# =====================================================================
gradient_permission:
  allow:
    - target: dynamics.motor_cortex.perturbation_response
      scales: ["parcel"]
      requires: ["temporal.sfreq_hz", "signal.si_units", "intervention.dose"]
    - target: intervene.tms.timing_operator
      scales: ["event"]
      requires: ["temporal.event_clock_relation", "intervention.dose"]
    - target: observe.eeg.noise_covariance
      scales: ["sensor"]
      requires: ["signal.si_units"]
    - target: transforms.frame_graph.captrak_to_head
      scales: ["sensor"]
      requires: ["calibration.electrode_positions", "calibration.fiducials"]
    - target: intervene.tms.efield_operator
      scales: ["voxel"]
      requires: ["calibration.device_pose", "intervention.field_solver", "calibration.head_model"]
    - target: observe.eeg.lead_field
      scales: ["sensor", "source"]
      requires: ["spatial.psf", "calibration.head_model", "calibration.transforms"]
    - target: transforms.clock_graph.tms_trigger_jitter
      scales: ["clock"]
      requires: ["temporal.jitter_sd"]
  frozen:
    - anatomy.connectome_prior
  forbid:
    - intervene.optimize_protocol          # R11: no A_safe validation exists for this source
    - infer.treatment_efficacy
  evaluation_only: false

# =====================================================================
# R_k  role and split policy
# =====================================================================
role: likelihood

split_policy:
  grouping_keys: ["participant"]
  grouping_note: >-
    All sessions, tasks and runs of a participant, including the MRI session
    and any derived tractogram or parcellation, stay in one fold. Four
    sessions of one person are not four subjects (R10).
  temporal_holdout: >-
    NOT AVAILABLE on this snapshot. This field previously read "available within
    participant: sessions are at least one week apart and the pre/post-ccPAS
    blocks are ordered within a session". Corrected 2026-08-06 (agent Galvani):
    the blocks were ordered during acquisition, but the ORDER IS NOT
    DISTRIBUTED. scans.tsv acq_time is "n/a" throughout, pybv 0.6.0 stripped the
    marker dates so meas_date is None, and no sidecar names a block. There is
    therefore no recorded within-session time axis to hold out on, and the rule
    "predict the post block from the pre block" cannot be enforced because
    neither block can be identified. See identity.subset_note.

    A ccPAS plasticity claim remains the right claim to want from this source;
    it is simply not evaluable until the per-run block labels are obtained from
    upstream (they are not in the released metadata) or from the authors.
  temporal_holdout_spec: null
  stimulus_holdout: >-
    the manipulated variable is the stimulation protocol (hemisphere,
    asynchrony, intensity, pre/post), so 'stimulus holdout' here means holding
    out an asynchrony condition. Holding out 9 ms would be the discriminating
    test for a timing-dependent plasticity operator.

    NOT RUNNABLE ON THIS SNAPSHOT. Only ses-async14ms binaries were fetched, so
    there is exactly one asynchrony level on disk and no asynchrony can be held
    out. The 4 ms and 9 ms bytes exist upstream; fetching them is what would
    unlock this test. Until then any timing-dependent plasticity claim from this
    source must be reported as COULD_NOT_RUN, never as a passing holdout. The
    runnable contrast here is pre/post ccPAS at 14 ms only.
  site_holdout: "not available: one site, one device"
  leakage_barrier: parent_lineage
  role_locked: true
  stimuli_shared_across_folds: false
  notes: >-
    This is the perturbation benchmark for G4. With only 13 participants and
    one site, leave-one-participant-out is the default; the Fisher-rank claim
    must be reported per participant, never pooled into a single number.
