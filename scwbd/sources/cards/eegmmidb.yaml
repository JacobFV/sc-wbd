# =====================================================================
# G_k  governance and consent
# =====================================================================
governance:
  license_spdx: "ODC-By-1.0"        # attribution, no NC, no SA.
  status: live
  license: "Open Data Commons Attribution License v1.0 (ODC-By 1.0)"
  license_url: "https://opendatacommons.org/licenses/by/1-0/"
  license_text_excerpt: >-
    "You are free: To Share: To copy, distribute and use the database. To
    Create: To produce works from the database. To Adapt: To modify,
    transform and build upon the database. As long as you: Attribute: You
    must attribute any public use of the database, or works produced from
    the database, in the manner specified in the license."
  dua_required: false
  credentials_required: false
  registration_required: false
  purpose_limits: >-
    None beyond the attribution requirement. PhysioNet distributes this as
    an open-access resource; no clinical or diagnostic use is claimed or
    supported by the data provider.
  consent_scope: >-
    unknown at the record level - the release carries no per-subject consent
    document. Subjects were volunteers in BCI2000 development studies; the
    published corpus is de-identified (headers carry "X X X X").
  redistribution: "permitted with attribution (ODC-By 1.0)"
  withdrawal: >-
    unknown - no withdrawal mechanism is published for this de-identified
    release. If PhysioNet retracts the release, this card must be set to
    status 'withdrawn' and the bytes deleted.
  privacy: >-
    de-identified: EDF patient fields are literally 'X X X X'; recording
    dates are present in headers (2009-08/09) but no personal identifiers.
    Raw EEG is nonetheless potentially biometric; storage stays local.
  retention: "retained on the local data root while the SC-WBD-001-beta claim is live"
  unavailable_reason: null
  # -- machine-readable siblings (consumed by the typed projection) --
  redistribution_class: full          # ODC-By permits redistribution with attribution
  withdrawal_status: none_pending
  privacy_class: deidentified
  contains_biometric: true            # raw EEG is potentially identifying
  may_release_weights: true           # attribution-only licence; weights are derived works
  may_release_examples: false         # do not ship raw subject traces in artifacts
  purpose_limits_list: ["attribution_required"]
  safeguards: ["local_storage_only", "no_subject_traces_in_released_artifacts"]
  dua: null

