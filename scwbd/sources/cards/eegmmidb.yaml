# =====================================================================
# S_k(signal)  native signal and units
# =====================================================================
signal:
  modality_evidence:
    eeg: {globs: ["S*/*.edf"], channel_type: EEG}
  modalities: ["eeg"]
  n_channels: 64
  channel_types: {eeg: 64}
  channel_names: >-
    international 10-10 extended (Sharbrough) subset; EDF labels are
    dot-padded ('Fc5.', 'Cz..') and normalised to 'FC5', 'Cz' by the loader
  units: "V (SI, converted by the loader from the EDF physical dimension 'uV')"
  file_physical_dimension: "uV"
  reference: >-
    unknown - the release does not document the acquisition reference for
    the 64-channel montage. The re-referencing gradient path is therefore
    disabled for this source.
  dynamic_range: "+/- 8092 uV (EDF physical min/max), i.e. +/- 8.092e-3 V"
  saturation: "clipping at the +/- 8092 uV rail; no saturation flags are distributed"
  quantization: "1 uV per least significant bit (digital and physical ranges are equal)"
  prefilter_header: "HP:0Hz LP:0Hz N:0Hz (as written in the EDF header; no filter is documented)"
  # -- machine-readable SI siblings --
  name: eegmmidb.scalp_potential
  si_units: V
  si_dynamic_range: [-8.092e-3, 8.092e-3]
  si_saturation: 8.092e-3
  si_quantization: 1.0e-6
  irreversible_aggregation: false

# =====================================================================
# S_k  spatial support
# =====================================================================
spatial:
  kind: sensor
  frame: template_10_05_head_RAS
  units: m
  psf: >-
    unknown - no lead field, head model or individual anatomy accompanies
    this corpus. Sensor measurements cannot be attributed to cortical
    sources from this source alone.
  extent: null
  n_elements: 64
  positions_are_digitised: false
  positions_source: >-
    template positions from the MNE 'standard_1005' montage matched by
    channel label (64/64 matched). These are NOT this subject's electrodes.

# =====================================================================
# T_k  temporal support and clocks
# =====================================================================
temporal:
  clock: eegmmidb.bci2000_amp
  dt: 0.00625
  sfreq_hz: 160.0
  integration_window: 0.0
  group_delay: unknown          # no anti-alias filter specification is published
  jitter_sd: unknown
  event_clock: eegmmidb.bci2000_amp
  event_clock_relation: >-
    identical to the sample clock: annotations are EDF+ TALs written by the
    same acquisition program, so event onsets convert to sample indices
    exactly.
  offset_drift: unknown
  record_duration_s: 30.0        # 60 s for the two baseline runs
  epoch_structure: "task runs are 2 min; baseline runs are 1 min"

# =====================================================================
# C_k  coordinates and calibration
# =====================================================================
calibration:
  id: eegmmidb.calibration
  frames: ["template_10_05_head_RAS"]
  fiducials: unknown
  transforms: []                 # no head<->device or head<->MRI transform exists
  calibration_points: unknown
  residuals: unknown
  device_pose: unknown
  raw_metadata: "EDF+ headers (start date/time, per-signal gain and prefilter strings)"
  electrode_positions: unknown   # template only - see spatial.positions_are_digitised
  head_model: unknown
  amplifier_gain_calibration: unknown

# =====================================================================
# O_k  observation model
# =====================================================================
observation:
  name: eegmmidb.scalp_eeg
  likelihood_kind: generative
  calibration_status: uncalibrated
  leakage_checked: true
  target_ports: ["eeg.sensor_64ch"]
  preprocessing_steps: []
  forward_physics: >-
    unknown for this source: no individual head model, no BEM, no lead
    field. Only a sensor-space observation model is admissible.
  observed_variables: ["scalp potential at 64 sensors"]
  preprocessing: "none - raw EDF+ as released; the loader applies no filter, reference change or resampling"
  latent_variables_claimed: []
  labels_leak_risk: "none (labels are stimulus cues written online, not derived from the EEG)"

# =====================================================================
# U_k  intervention model
# =====================================================================
intervention: null   # nothing is manipulated except the visual cue; no stimulation

# =====================================================================
# M_k  missingness and censoring
# =====================================================================
missingness:
  planned: "none - all 64 channels are recorded in every run"
  unplanned: "36 run(s) across 3 subject(s) deviate from the nominal 160 Hz / 64-channel header and are excluded, not repaired"
  artifact_rejection: "none applied by the provider and none applied here"
  dropout: "none within a session"
  attrition: "not applicable (single session)"
  mechanism: planned
  handling: drop_episode
  post_outcome_selection: false
  censoring_correlated_with_state: false
  policy: >-
    Runs whose header deviates from 160 Hz / 64 channels are NOT silently
    resampled or padded: they are excluded from any 160 Hz likelihood term
    and reported in population.known_anomalies. Missing channels are never
    imputed as zero (ARCHITECTURE.md §7 rule 1).

# =====================================================================
# B_k, V_k, Delta_k  uncertainty ledger
# =====================================================================
ledger:
  variance:
    measurement: 1.0e-12         # V^2; ~1 uV RMS quantisation+instrument floor
    session: unknown             # single session per subject: not estimable here
    parameter: unknown
    model: unknown
    numerical: 0.0
  bias_interval: [-8.0e-6, 8.0e-6]
  bias_status: externally_bounded
  bias_bound_justification: >-
    Amplifier DC offset is bounded by the +/- 8092 uV rail and the 1 uV
    quantisation step; without a documented reference the sign and size of
    any common-mode offset is unresolved, so the bound is the rail-scaled
    envelope rather than an estimate.
  model_discrepancy: null        # empirical source; no simulator/teacher involved
  validity_domain:
    population: "adult volunteers, demographics unknown"
    state: "awake, seated, cued motor execution and motor imagery"
    frequency_band_hz: [0.0, 80.0]
    spatial_scale: "scalp sensor; no source-level validity claimed"

# =====================================================================
# A_k  gradient permission
# =====================================================================
gradient_permission:
  allow:
    - target: observe.eeg.sensor_space_head.gain
      scales: ["sensor"]
      requires: ["signal.units", "temporal.sfreq_hz"]
    - target: dynamics.sensorimotor.population_prior
      scales: ["parcel"]
      requires: ["signal.units", "temporal.sfreq_hz", "population.n_participants"]
    - target: observe.eeg.noise_covariance
      scales: ["sensor"]
      requires: ["signal.units"]
    - target: observe.eeg.lead_field
      scales: ["sensor", "source"]
      requires: ["calibration.electrode_positions", "spatial.psf", "calibration.head_model"]
    - target: transforms.reference_montage_operator
      scales: ["sensor"]
      requires: ["signal.reference"]
    - target: transforms.clock_graph.eeg_group_delay
      scales: ["clock"]
      requires: ["temporal.group_delay", "temporal.jitter_sd"]
  frozen:
    - anatomy.connectome_prior
    - observe.bold.*
  forbid:
    - infer.individual_posterior.identity   # no demographics: no individualisation claim
    - intervene.*                           # nothing was manipulated
  evaluation_only: false

# =====================================================================
# R_k  role and split policy
# =====================================================================
role: likelihood

split_policy:
  grouping_keys: ["participant"]
  grouping_note: >-
    All 14 runs of a subject share one participant key and one session key;
    a run may never appear on a different side of a fold from its sibling
    runs (R10).
  temporal_holdout: >-
    not applicable - one session per participant, so no future-session
    holdout is available. An individualisation claim (G5) is NOT evaluable
    on this source.
  stimulus_holdout: >-
    available at the task-condition level (left fist / right fist / both
    fists / both feet / rest). Because T1/T2 mean different things in fist
    and feet runs, the loader resolves them to explicit labels before any
    stimulus-level split.
  site_holdout: >-
    not available: one site, one device. This source cannot falsify a
    site/device shortcut on its own.
  leakage_barrier: parent_lineage
  role_locked: true
  stimuli_shared_across_folds: false
  temporal_holdout_spec: null
  notes: >-
    Default protocol: 5-fold participant-level holdout with seed recorded in
    the run manifest, audited by scwbd.sources.splits.leakage_audit.
