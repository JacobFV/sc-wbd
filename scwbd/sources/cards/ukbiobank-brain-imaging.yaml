governance:
  status: unavailable
  unavailable_reason: >-
    access requires an approved research application and a signed Material Transfer Agreement with UK Biobank, plus per-project fees. No application was made, so no bytes were downloaded and no field of this card is measured.
  license: "UK Biobank Material Transfer Agreement (not an open licence)"
  license_url: "https://www.ukbiobank.ac.uk/media/p3zffpn5/biobank-mta.pdf"
  license_text_excerpt: >-
    Access is granted per approved project under an MTA; redistribution of individual-level data is prohibited and derived data must be returned to UK Biobank.
  dua_required: true
  credentials_required: true
  registration_required: true
  purpose_limits: >-
    health-related research in the public interest, as approved per application; no re-identification; no redistribution.
  consent_scope: >-
    broad consent for health research with a documented withdrawal mechanism that participants may exercise at any time.
  redistribution: "not permitted without the data provider's agreement"
  withdrawal: "governed by the provider's withdrawal policy, which SC-WBD cannot honour without holding the data"
  privacy: >-
    pseudonymised individual-level imaging and phenotype data; treated as identifiable in practice.
  retention: "not applicable: no bytes held"
  redistribution_class: none
  withdrawal_status: unknown
  privacy_class: pseudonymized
  contains_biometric: true
  may_release_weights: false
  may_release_examples: false
  purpose_limits_list: ["approved_project_only", "no_redistribution", "no_reidentification"]
  safeguards: ["not_downloaded"]
  dua: "UK Biobank Material Transfer Agreement"

