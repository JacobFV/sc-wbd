schema_version: scwbd-source-card/1.0.0

# =====================================================================
# UNAVAILABLE-BY-BUDGET, not by licence.  THINGS-EEG2 is open and reachable;
# the raw per-participant archives are simply too large to fetch inside this
# build's time budget at the throughput actually measured.  Everything needed
# to fetch it later is pinned below.  Nothing is claimed about its contents
# beyond what the OSF/figshare listing states, because no byte of it was read.
# =====================================================================
identity:
  id: things-eeg2
  name: "THINGS-EEG2: a large and rich EEG dataset for modeling human visual object recognition"
  version: "unknown"
  release_date: "2021-06-24"       # OSF project creation date, read from the OSF API
  doi: "10.1016/j.neuroimage.2022.119754"
  citation: >-
    Gifford AT, Dwivedi K, Roig G, Cichy RM (2022). A large and rich EEG
    dataset for modeling human visual object recognition. NeuroImage
    264:119754. Data: OSF project 3jk45.
  source_url: "https://osf.io/3jk45/"
  download_url: "https://files.osf.io/v1/resources/crxs4/providers/figshare/<article_id>?action=download"
  download_method: >-
    not completed. The OSF node crxs4 ("Raw EEG data") stores one zip per
    participant on a figshare add-on. Article ids read from the OSF API on
    2026-08-05: sub-01=33244238, sub-02=33247340, sub-03=33247355,
    sub-04=33247361, sub-05=33247376, sub-06=34404491, sub-07=33247622,
    sub-08=33247652, sub-09=38916017, sub-10=33247694. sub-01.zip is
    11,135,024,187 bytes (verified by HTTP HEAD).
  retrieved_utc: null
  parent_dataset: null
  derived_from: null
  derivatives_included: []
  software: {}
  container_hash: unknown
  local_path: null
  file_manifest: null

governance:
  status: unavailable
  unavailable_reason: >-
    Reachable and openly shared - this is a time/bandwidth decision, not a
    licence barrier. Measured throughput to the OSF figshare redirect was
    ~0.4 MB/s, so one 11.1 GB participant archive needs roughly 7.5 hours and
    the ten-participant raw release is ~111 GB. A partial download (957 MB of
    sub-01) was fetched, found to be far off pace, and deleted rather than
    left on disk as a half-truth. The dataset stays in the register with its
    pinned figshare article ids so it can be fetched by a later run without
    re-discovery.
  license: >-
    unknown - the OSF project 3jk45 declares no licence through the OSF API
    (the /license endpoint returns 404 and node_license carries an empty
    copyright holder). The associated paper is open access, but the data
    licence itself is not machine-readable, so the licence field cannot be
    populated and the source may not enter the mixture on an assumption.
  license_url: "https://osf.io/3jk45/"
  license_text_excerpt: >-
    unknown - no licence text is published with the OSF project.
  dua_required: false
  credentials_required: false
  registration_required: false
  purpose_limits: >-
    unknown, pending the licence question above.
  consent_scope: >-
    unknown - per-participant consent documents are not distributed; the
    paper states the study was approved by the ethics committee of Freie
    Universitaet Berlin.
  redistribution: "unknown - see license"
  withdrawal: "unknown"
  privacy: >-
    unknown; the release is described as de-identified EEG from 10 healthy
    adult volunteers.
  retention: "not applicable: no bytes held"
  redistribution_class: unknown
  withdrawal_status: unknown
  privacy_class: deidentified
  contains_biometric: true
  may_release_weights: false
  may_release_examples: false
  purpose_limits_list: []
  safeguards: ["not_downloaded"]
  dua: null

