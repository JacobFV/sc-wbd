gradient_permission:
  allow: []
  frozen: []
  forbid: ["*"]
  evaluation_only: false
  note: >-
    Empty by construction. Before any allow entry is added this card must be
    rewritten from real files, and the licence question in governance.license
    must be resolved - an unresolved licence is a hard stop, not a warning.

role: likelihood

split_policy:
  grouping_keys: ["participant", "session"]
  temporal_holdout: "not applicable while unavailable"
  temporal_holdout_spec: null
  stimulus_holdout: >-
    would be mandatory for this source: it is a rapid serial visual
    presentation dataset over thousands of object images, so image and
    semantic-category holdout is the difference between an image-recognition
    result and a claim about brain dynamics (Appendix D, "Stimulus
    memorization").
  leakage_barrier: parent_lineage
  role_locked: true
  stimuli_shared_across_folds: false
  notes: >-
    Grouping and stimulus-holdout policy are fixed in advance so that, if the
    data are fetched later, the barrier predates any result.
