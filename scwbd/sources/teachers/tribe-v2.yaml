schema_version: scwbd-source-card/1.0.0

# =====================================================================
# QUARANTINED TEACHER.  This card is DELIBERATELY not in
# scwbd/sources/cards/: it is not a dataset, it is a model, and it must
# not be swept into the training mixture by a directory glob.  Load it
# explicitly with scwbd.sources.cards.load_card().
#
# The artefact IS obtainable and has been obtained, hashed and executed
# CPU-only (see identity.file_manifest and ledger.measured_probes).
# The VALIDATION is not: no measurement of this teacher against real
# measured BOLD on matched stimuli exists on this machine.  Appendix B
# therefore applies its own rule -- "the field remains unknown, and the
# corresponding loss or gradient path is disabled".  ledger.model_discrepancy
# is unknown and gradient_permission.allow is empty.  Nothing in this card
# authorises a training gradient.
#
# See reports/teacher_assessment.md for the measurements and the reasoning.
# =====================================================================

# =====================================================================
# I_k  identity and lineage
# =====================================================================
