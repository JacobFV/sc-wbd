  name: "TRIBE v2 (TRImodal Brain Encoder) -- population video/audio/text -> fsaverage5 BOLD encoder"
  version: "hf:f894e783020944dcd96e5568550afe2aa9743f9f"
  release_date: "2026-03-27"        # HuggingFace repo lastModified, measured via the HF API
  doi: "unknown - the release cites arXiv:2605.04326; no DOI is minted for the weights"
  citation: >-
    d'Ascoli S et al. (2026). A foundation model of vision, audition and
    language for in-silico neuroscience (TRIBE v2). arXiv:2605.04326.
    Weights: https://huggingface.co/facebook/tribev2 revision
    f894e783020944dcd96e5568550afe2aa9743f9f.
  source_url: "https://huggingface.co/facebook/tribev2"
  download_url: "https://huggingface.co/facebook/tribev2/resolve/f894e783020944dcd96e5568550afe2aa9743f9f/best.ckpt"
  download_method: >-
